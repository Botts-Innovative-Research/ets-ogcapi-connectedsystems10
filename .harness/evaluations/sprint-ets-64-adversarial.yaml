    title: "OSH upstream divergence field is ambiguous but not a completion blocker"
    risk: "local-osh-provenance.txt labels the ahead/behind tuple as osh_upstream_behind_ahead=0 3, which future reviewers may misread as three local commits ahead."
    evidence:
