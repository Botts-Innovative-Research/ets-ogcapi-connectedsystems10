findings:
  - id: RAZE-S52-001
    severity: HIGH
    status: OPEN
    category: false_exact_mapping
    title: The System-reference procedure omits its released GeoJSON schema branch
    summary: >-
      The pinned /conf/sf/ref-from-system procedure requires each nested
      /systems/{sysId}/samplingFeatures response to be traversed and, when its
      Content-Type is application/geo+json, validated through /conf/geojson/sf-schema.
      The implementation traverses the response and discards the TraversalResult.
      It never invokes SamplingFeaturesSupport schema validation, so invalid GeoJSON
      can PASS. The CP, capability scenario, reviewed mapping evidence, and 5/5 exact
      status all omit the same released step.
    impact: >-
      /conf/sf/ref-from-system is not an exact implementation. The method can emit a
      false PASS for schema-invalid nested GeoJSON, and the reported 5/5 exact
      coverage and final-gate status are overstated.
    evidence:
      - >-
        Pinned Annex A lines 740-745 retrieve every System, GET each nested endpoint,
        require 200, paginate, and execute /conf/geojson/sf-schema for GeoJSON.
      - >-
        SamplingFeaturesTests.java lines 181-198 accept and traverse nested responses
        but never inspect the returned pages or call validateSamplingFeatureEndpoint.
      - >-
        VerifySamplingFeaturesHttpProcedures.java lines 211-223 use generic JSON empty
        nested collections; the positive test therefore never exercises the mandatory
        GeoJSON schema branch.
      - >-
        reviewed-ats-mappings.json classifies /conf/sf/ref-from-system as exact while
        its evidence mentions only status and pagination, not the released schema step.
      - >-
        CP-012, REQ-ETS-PART1-007, its REF-FROM-SYSTEM scenario, traceability, story,
        contract, status, and test-results all repeat or rely on the incomplete model.
      - >-
        The local-OSH XML honestly records the current method as PASS, but that generic
        JSON run cannot verify the omitted GeoJSON branch.
    required_fixes:
      - >-
        Add the released conditional schema validation to every GeoJSON page returned
        by every nested System Sampling Features endpoint.
      - >-
        Add controlled HTTP tests proving valid nested GeoJSON passes and invalid
        nested GeoJSON fails, including a defect on a later page and later System.
      - >-
        Correct the spec, CP, scenario, design, and exact-mapping evidence to state the
        released conditional schema step.
      - >-
        Treat /conf/sf/ref-from-system as not exact until the implementation and tests
        satisfy that step; regenerate coverage after remediation.

  - id: RAZE-S52-002
    severity: MEDIUM
    status: OPEN
    category: incomplete_iteration
    title: Actual-media evidence SKIPs can hide later defects
    summary: >-
      The collection procedures accumulate an unsupported flag only when the
      advertised items link is filtered before request. If a link advertises GeoJSON
      but an actual response page is unsupported, Part1ApiCommonSupport throws
      SkipException and the outer collection loop terminates immediately. The same
      early termination occurs for a non-comparable canonical response and for an
      unsupported nested System response.
    impact: >-
      A first unsupported response can prevent inspection of a later malformed
      collection, canonical item, page, or System. The outcome becomes SKIP instead of
      the required later FAIL, contradicting the complete-iteration scenarios and the
      claim that inspectable defects are retained before final SKIP.
    evidence:
      - >-
        Part1ApiCommonSupport.java lines 429-441 throws SkipException on unsupported
        actual media before parsing.
      - >-
        SamplingFeaturesTests.java lines 87-115 and 153-166 call the helper without
        catching per-collection evidence SKIPs; lines 101-105 also immediately SKIP on
        non-comparable canonical actual media.
      - >-
        SamplingFeaturesTests.java lines 185-198 calls the nested System helper without
        preserving later-System inspection after an evidence SKIP.
      - >-
        The partial-collection regression at VerifySamplingFeaturesHttpProcedures.java
        lines 152-162 covers only an advertised application/json link and asserts that
        the unsupported endpoint is never requested. It does not cover advertised
        GeoJSON followed by unsupported actual media.
      - >-
        REQ-ETS-PART1-007 and SCENARIO-ETS-PART1-007-RELEASED-COLLECTION-COMPLETE-001
        require all inspectable evidence to be processed and prohibit an earlier result
        from hiding a later defect.
    required_fixes:
      - >-
        Accumulate expected evidence-limitation SKIPs at the narrow collection, item,
        or System boundary, continue all independently inspectable evidence, and throw
        the aggregate SKIP only after no later failure is found.
      - >-
        Do not catch or downgrade assertion failures, unsafe pagination, non-200
        responses, invalid metadata, invalid schema, or canonical identity/content
        failures.
      - >-
        Add regressions where an actual-media mismatch precedes a later invalid
        collection, canonical item, page, and System response.

