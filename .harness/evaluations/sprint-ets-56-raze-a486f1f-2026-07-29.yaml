      - "/tmp/sprint-ets-56-candidate-a486f1f.oaXFoU/e2e/populated-results/s-ets-01-03-teamengine-smoke-2026-07-29.xml:1543"
    impact: "Controlled mock HTTP proves helper behavior only; it cannot approve the mutation implementation under the repository's mandatory E2E policy."
    required_fix:
      - "After implementation fixes, run the exact committed candidate against a separate, unmodified, dedicated mutable IUT that declares the exact inherited classes."
      - "Do not modify OSH or TeamEngine and do not relabel these honest SKIPs as positive evidence."
      - "Keep Sprint 56 incomplete if no suitable IUT is available."

  - id: RAZE-ETS-56-008
    severity: MEDIUM
    title: "Custom discovery and exact mappings overstate coverage"
    problem: "The spec and mapping claim every advertised applicable non-root collection, but isCustomCollection silently excludes every id beginning with all_ and several literal ids without normative metadata proving they are root collections. All twelve mappings are already marked exact despite the defects above."
    evidence:
      - ".harness/contracts/sprint-ets-56.yaml:32"
      - "src/main/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/createreplacedelete/CreateReplaceDeleteSupport.java:418"
      - "src/main/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/createreplacedelete/CreateReplaceDeleteSupport.java:978"
      - "src/main/resources/org/opengis/cite/ogcapiconnectedsystems10/ats/reviewed-ats-mappings.json:722"
      - "src/main/resources/org/opengis/cite/ogcapiconnectedsystems10/ats/reviewed-ats-mappings.json:799"
      - "src/main/resources/org/opengis/cite/ogcapiconnectedsystems10/ats/reviewed-ats-mappings.json:821"
    impact: "A valid custom collection can be skipped and the generated coverage report reports closure that the implementation has not earned."
    required_fix:
      - "Replace id-name heuristics with a normative root/non-root determination or exercise every matching advertised /collections entry."
      - "Downgrade affected mappings and regenerate coverage until all required findings are closed and re-reviewed."

