required_findings:
  - id: RAZE-S51-001
    severity: HIGH
    disposition: REQUIRED_FIX
    category: false_pass_recursive_association
    title: Recursive association can pass while omitting the parent Deployment's own resources
    summary: >-
      The released procedure requires each advertised parent association to
      include resources associated with the parent Deployment itself as well as
      resources associated with every nested Subdeployment. Sprint 51 builds
      its expected set only from descendant association endpoints. A server
      that returns every descendant resource but omits resources associated
      directly with the parent therefore passes.
    evidence:
      - >-
        Released Annex A lines 526-550 require each response to include
        resources associated with the parent deployment or any of its
        subdeployments at all nesting levels.
      - >-
        clause_11_requirements_class_subdeployments.adoc lines 75-96 likewise
        says the adjusted set includes the main deployment and all
        subdeployments.
      - >-
        SubdeploymentsTests.java:190-216 computes expected exclusively by
        iterating hierarchy.descendants(parent); no independent parent-owned
        resource set is added.
      - >-
        VerifySubdeploymentsHttpProcedures.java:367-381 gives the parent
        response root, child, and grandchild IDs, but child/grandchild endpoints
        establish only the descendant expectation. There is no regression in
        which the root ID is omitted while all descendant IDs remain.
      - >-
        spec.md:2177-2185, CP-011, the story, contract, and reviewed mapping all
        narrow the oracle to the descendant union while classifying the
        released procedure exact.
    impact: >-
      This is a direct false PASS for /conf/subdeployment/recursive-assoc and
      makes its reviewed exact mapping unsound.
    required_fix: >-
      Establish independent expected evidence for resources associated
      directly with each parent as well as every descendant. If the API cannot
      supply an independent parent-only oracle, require explicit test-fixture
      evidence or SKIP rather than PASS. Add a deployed HTTP regression where
      the parent endpoint contains every descendant ID but omits a known
      parent-owned ID, and require failure. Reconcile the spec, design, story,
      contract, traceability, and mapping before restoring exact status.

  - id: RAZE-S51-002
    severity: MEDIUM
    disposition: REQUIRED_FIX
    category: non_causal_dependency_evidence
    title: Direct Deployment sabotage does not prove the claimed dependency cascade
    summary: >-
      The primary local OSH baseline already has three failed Deployment
      procedures and already skips Subdeployment setup plus all five methods.
      The sabotage run adds a marker failure, but its Subdeployment blocker is
      another pre-existing Deployment failure. The same observed cascade
      occurs without the injected defect, so the archive cannot establish that
      the sabotage caused it.
    evidence:
      - >-
        sprint-ets-51-local-osh-teamengine-2026-07-27.xml records
        219/39/5/175 and all five Subdeployment methods SKIP because
        deploymentsReferencedFromSystemsAreValid failed.
      - >-
        sprint-ets-51-deployment-sabotage-teamengine-2026-07-27.xml records
        219/39/6/174, the marker canonicalDeploymentsEndpointIsValid failure,
        and all five methods SKIP because deploymentCollectionsAreValid failed,
        not because of the injected marker.
      - >-
        sprint-ets-51-deployment-sabotage-verdict-2026-07-27.log checks only
        marker FAIL plus setup/method SKIP; it does not compare against a
        prerequisite-passing baseline or require the marker to be the blocker.
      - >-
        The contract, spec implementation evidence, story, traceability,
        status, test-results, changelog, and durable verification summary all
        classify this run as a passing direct dependency-sabotage gate.
    impact: >-
      Structural and mocked-context tests support the intended dependency, but
      the required behavioral sabotage gate currently provides false
      confidence and cannot distinguish correct cascading from the baseline
      IUT's existing failures.
    required_fix: >-
      Run a causal baseline/sabotage pair in which inherited Deployment
      prerequisites first succeed and Subdeployment setup is runnable, then
      inject exactly one Deployment failure and prove that setup plus all five
      methods change to SKIP before Subdeployment IUT access. Require the
      injected method to be the reported blocker, or otherwise archive an
      equivalent controlled TestNG/TeamEngine dependency experiment that
      isolates one variable. Correct the current PASS claims until that
      evidence exists.

  - id: RAZE-S51-003
    severity: MEDIUM
    disposition: REQUIRED_FIX
    category: false_failure_link_identity
    title: Lexical URI equality can reject a semantically correct Subdeployment target
    summary: >-
      Sprint 51 first accepts effective-port same-origin equivalence, then uses
      java.net.URI.equals for the final target comparison. URI.equals does not
      equate an omitted default port with its explicit form. Thus an API root
      using http://host can be paired with a valid advertised target using
      http://host:80 at the required path, yet the procedure fails.
    evidence:
      - >-
        Released Annex A lines 462-466 require the link target to be the
        specified Subdeployment URL; they do not require one lexical
        serialization of an equivalent HTTP URL.
      - >-
        SubdeploymentsSupport.java:121-140 computes the expected URI and uses
        expected.equals(actual), after resolveLink at lines 183-201 accepts
        same origin using effective default ports.
      - >-
        VerifySubdeploymentsSupport.java and
        VerifySubdeploymentsHttpProcedures.java cover the identical spelling,
        wrong path/query, relation arrays, and cross-origin rejection, but not
        explicit-default-port equivalence.
      - >-
        SCENARIO-ETS-PART1-005-RELEASED-LINK-EXACT-001 and the reviewed mapping
        turn this project-added lexical restriction into exact conformance
        evidence.
    impact: >-
      A conforming target URL can receive a false FAIL, so the collection
      procedure is not yet an exact implementation of the released test.
    required_fix: >-
      Compare normalized HTTP target identity: scheme, host, effective port,
      normalized raw path, and the required absence of query and fragment.
      Preserve wrong-parent and trailing-path rejection. Add focused and
      deployed HTTP regressions for explicit default ports and equivalent path
      encoding, then reconcile the exact-link wording and mapping.

  - id: RAZE-S51-004
    severity: MEDIUM
    disposition: REQUIRED_FIX
    category: false_failure_association_selection
    title: First association occurrence can hide a usable later representation
    summary: >-
      Association discovery validates matching occurrences but unconditionally
      returns the first one without considering its advertised media type.
      The consumer then requires a JSON collection. A conforming resource with
      an HTML association occurrence first and a usable JSON occurrence later
      can therefore fail status/parsing even though suitable evidence is
      advertised.
    evidence:
      - >-
        Released Annex A lines 528-550 says that if an association link exists,
        issue a GET to the link URL and verify the returned resource set. It
        does not prescribe document-order selection.
      - >-
        SubdeploymentsSupport.java:143-163 collects all matching URIs and
        returns candidates.stream().findFirst() without retaining or selecting
        link type.
      - >-
        SubdeploymentsTests.java:271-277 requests JSON and immediately parses
        the selected association endpoint.
      - >-
        VerifySubdeploymentsHttpProcedures.java:410-430 advertises exactly one
        application/json link per relation. No unit or HTTP test places an
        unsupported occurrence before a usable JSON occurrence.
    impact: >-
      The recursive-association procedure can falsely fail a conforming
      multi-representation link set, and its current exact mapping overstates
      selection behavior.
    required_fix: >-
      Retain href and normalized type for every association occurrence. Select
      a same-origin JSON-compatible candidate deterministically, allowing an
      absent type to be negotiated and gated by actual response media. When no
      safe comparable candidate exists, warn and SKIP rather than fail or pass.
      Add focused and deployed HTTP regressions with unsupported and
      cross-origin occurrences before a valid same-origin JSON occurrence.

