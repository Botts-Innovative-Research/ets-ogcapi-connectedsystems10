  findings:
    - id: RAZE-S55-R3-DEPLOYED-SYSTEM-PATH-001
      severity: HIGH
      summary: "Deployment observedProperty and controlledProperty procedures can PASS from association-wrapper fields or unrelated nested hrefs without following the prescribed deployed-System target."
      references:
        - "src/main/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/advancedfiltering/AdvancedFilteringSupport.java:732"
        - "src/main/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/advancedfiltering/AdvancedFilteringSupport.java:744"
        - "src/main/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/advancedfiltering/AdvancedFilteringSupport.java:918"
        - "src/main/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/advancedfiltering/AdvancedFilteringSupport.java:951"
        - "src/test/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/advancedfiltering/VerifyAdvancedFilteringHttpProcedures.java:341"
        - "openspec/capabilities/ets-ogcapi-connectedsystems/spec.md:2886"
      analysis: "For Deployment property relations, relationIdentifiers first applies collectRelation directly to each deployedSystems item. A wrapper-level observedProperty or controlledProperty therefore becomes predicate evidence before collectDeployedSystemProperties resolves the wrapper's System association. collectRelationTargets then recursively collects every href below a system-shaped value, so an unrelated nested link can also be read as a System target. The existing root-shortcut regression rejects aliases on the canonical Deployment representation but does not attack contradictory aliases or extra hrefs inside deployed-System wrappers. A non-conforming server can return the same wrapper on seed and filtered requests and satisfy the current oracle."
      required_fix: "For Deployment observedProperty and controlledProperty, ignore property aliases on deployed-System wrappers. Extract only the deployed-System association target, resolve that target representation, and collect properties only from the resolved System. Do not recursively treat every nested href as a System target. Add fail-closed fixtures for a wrapper-level bogus property and an unrelated nested href."

    - id: RAZE-S55-R3-INVALID-HREF-IDENTITY-001
      severity: HIGH
      summary: "A malformed association href is converted into an invented urn:invalid-reference value that can become global identifier evidence."
      references:
        - "src/main/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/advancedfiltering/AdvancedFilteringSupport.java:827"
        - "src/main/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/advancedfiltering/AdvancedFilteringSupport.java:859"
        - "src/main/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/advancedfiltering/AdvancedFilteringSupport.java:1353"
        - "openspec/capabilities/ets-ogcapi-connectedsystems/spec.md:2878"
        - "openspec/capabilities/ets-ogcapi-connectedsystems/spec.md:2951"
      analysis: "resolve catches an invalid href and fabricates an absolute URN. readReference treats that synthetic, cross-origin-looking URN as valid global identity whenever hrefIdentity is true. If another relation supplies local evidence and the server ignores the synthetic UID filter, recomputing the same synthetic identity on returned resources allows a false PASS. The contract permits the actual unresolved target URI where the ATS says so; it does not permit an invented URI for malformed input."
      required_fix: "Preserve only syntactically valid unresolved target URIs. A malformed href must contribute no identifier and must never be replaced with a synthetic URN. Add a regression combining valid local relation evidence, a malformed href, and union or ignored-filter behavior."

    - id: RAZE-S55-R3-MAPPING-HONESTY-001
      severity: MEDIUM
      summary: "Several reviewed exact-mapping evidence strings claim checks the implementation does not perform."
      references:
        - "src/main/resources/org/opengis/cite/ogcapiconnectedsystems10/ats/reviewed-ats-mappings.json:529"
        - "src/main/resources/org/opengis/cite/ogcapiconnectedsystems10/ats/reviewed-ats-mappings.json:538"
        - "src/main/resources/org/opengis/cite/ogcapiconnectedsystems10/ats/reviewed-ats-mappings.json:547"
        - "src/main/resources/org/opengis/cite/ogcapiconnectedsystems10/ats/reviewed-ats-mappings.json:718"
        - "src/main/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/advancedfiltering/AdvancedFilteringSupport.java:191"
        - "src/main/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/advancedfiltering/AdvancedFilteringSupport.java:226"
        - "src/main/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/advancedfiltering/AdvancedFilteringSupport.java:439"
      analysis: "The resource-by-property mapping claims seed inclusion, and the geometry mapping claims selected-seed inclusion, but neither procedure checks sameResource for its seed. The System parent mapping claims nested-subsystem discovery although PARENT_SYSTEM has no subresource traversal. The indirect-foi mapping claims returned-representation validation although recommendation queries use generic collection traversal and set comparisons without validateEndpoint. These extra claims are not needed by the corresponding ATS procedures, but they make the reviewed evidence inaccurate."
      required_fix: "Reconcile each mapping evidence string to the behavior actually implemented, or add the claimed checks only where the released ATS requires them. Re-run the mapping and coverage verifier after reconciliation."

    - id: RAZE-S55-R3-EVIDENCE-PRESERVATION-001
      severity: MEDIUM
      summary: "The exact focused, full-Maven, image, runtime, and container transcripts are ignored files and are not part of the current reconciliation status."
      references:
        - ".gitignore:27"
        - "ops/test-results/sprint-ets-55-part1-advanced-filtering-final-r2-2026-07-29/exact-085a81f-artifact-manifest.sha256:1"
        - "ops/test-results/sprint-ets-55-part1-advanced-filtering-final-r2-2026-07-29/final-candidate-verification.md:15"
        - "epics/stories/s-ets-55-01-part1-advanced-filtering-closure.md:82"
      analysis: "All sixteen entries in the exact manifest hash-check successfully in the current workspace, but the critical *.log transcripts are ignored by Git and do not appear in git status. A normal reconciliation commit would retain the manifest while dropping the artifacts it authenticates, despite the story and verification summary calling the gates archived."
      required_fix: "Before reconciliation is committed, explicitly preserve every exact log named by exact-085a81f-artifact-manifest.sha256, using force-add or a non-ignored archival format. Re-run sha256sum -c against the staged evidence set."

    - id: RAZE-S55-R3-CONTRACT-TRACE-001
