    severity: LOW
    title: Positive fixture depth remains narrower than the traversal implementation
    detail: >-
      Controlled HTTP coverage executes all five positive methods and several
      fail-closed cases, but does not establish a fully successful second page
      containing multiple valid Deployment items and multiple Systems. Code
      inspection shows complete loops, so this remains test-depth risk rather
      than a required defect.
  - id: RAZE-S49-C02
    severity: LOW
    title: The resources procedure is deployed through its canonical endpoint instance
    detail: >-
      The private endpoint-parameterized implementation is exercised at
      api_root/deployments by both resources and canonical methods. This matches
      the established project pattern, but mapping language should continue to
      identify the canonical instantiation rather than imply external endpoint
      injection.
  - id: RAZE-S49-C03
    severity: LOW
    title: Released Annex has an apparent SensorML media-variable typo
    detail: >-
      The released ref-from-system procedure uses an undefined SensorML media
      variable while adjacent text defines application/sml+json. The
      implementation's application/sml+json interpretation remains reasonable
      and should stay documented as a source inference.

