success_criteria:
  - All five released Subsystem procedures have exact reviewed mappings.
  - Collection discovery counts exact rel=subsystems link occurrences and validates the exact resolved target.
  - HTTP success and actual media are established before parsing every root and nested hierarchy page; absent or unsupported media warns and skips.
  - SensorML hierarchy evidence is accepted from the first response without requiring a prior GeoJSON response.
  - Collection validation accepts schema-valid SensorML without a non-standard id member; recursive graph discovery may require local ids.
  - Actual GeoJSON and SensorML JSON media types select fail-closed System schemas.
  - Recursive-parameter requests contain exact true or false values and do not parse unrelated response content.
  - Expected descendants are derived independently from bounded direct hierarchy edges.
  - Shortcut edges that also expose a transitive descendant as direct fail closed.
  - Default and recursive=false exclude transitive descendants while recursive=true includes every level.
  - Duplicate IDs, pagination cycles, and hierarchy cycles fail closed.
  - Association implementation is established from canonical top-level endpoints before every parent and descendant is checked.
  - Empty positive evidence produces SKIP rather than PASS.
  - Each procedure retrieves only its own prerequisites.
  - Focused and full Maven verification succeeds.
  - TeamEngine executes every changed method against the primary local OSH IUT.
  - A controlled HTTP fixture executes successful positive paths for all five methods.
  - Exact-image runtime, dependency, and credential gates pass.
  - Raze reports no unresolved required fixes.
guardrails:
  - Do not modify OSH or TeamEngine source code or binaries.
  - Do not add hosted CI.
  - Do not classify SKIP as positive conformance evidence.
  - Do not use a recursive endpoint response as its own expected closure.
