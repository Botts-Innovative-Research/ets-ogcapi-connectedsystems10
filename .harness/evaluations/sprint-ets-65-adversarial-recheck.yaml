findings:
  - id: RAZE-ETS65-RECHECK-FALSEPASS-001
    severity: HIGH
    status: OPEN
    title: "/req/json/mediatype-write can still false-PASS when only one scoped operation advertises application/json"
    evidence:
      - "Part2JsonSupport.java:136-147 reports a resource label missing only if apiDefinitionAdvertisesJsonWriteForTemplates returns false."
      - "Part2JsonSupport.java:222-236 returns true on the first matching POST or PUT with application/json requestBody content."
      - "The helper does not continue scanning other matching scoped POST/PUT operations to ensure each CREATE or REPLACE operation for that resource endpoint also advertises application/json."
      - "VerifyPart2JsonTests.java:126-168 covers one positive scoped operation, OPTIONS-only rejection, non-application/json rejection, and unrelated-path rejection, but not the mixed-operation case where one scoped operation is good and another scoped operation lacks application/json."
    impact: "A service-desc with POST /datastreams application/json and PUT /datastreams/{id} application/xml-only would pass the DataStream label even though a scoped replace operation lacks JSON write-media support. That is a false PASS risk for OGC 23-002 Annex A.9 Requirement 94 semantics."
    required_fix: "Change mediatype-write evaluation to inspect all scoped POST/PUT create/replace operations that exist for the declared Part 2 resource endpoint templates and fail/report each operation whose requestBody content omits exact application/json. Add a regression covering mixed good/bad scoped operations. Reconcile mapping evidence if the implementation semantics change."

  - id: RAZE-ETS65-RECHECK-DOC-001
    severity: LOW
    status: OPEN
    title: "OpenSpec no-mutation scenario names public GeoRobotix while current policy and Sprint 65 evidence use local OSH"
    evidence:
      - "openspec/capabilities/ets-ogcapi-connectedsystems/spec.md:1605-1609 says the no-mutation scenario is GIVEN TeamEngine smoke runs against the public GeoRobotix IUT."
      - "AGENTS.md says primary development E2E target is a self-run local OSH instance, with GeoRobotix only advisory."
      - "ops/status.md:31-40 and ops/test-results.md:36-45 document local OSH TeamEngine smoke and local-OSH request logs for Sprint 65."
    impact: "This is not an implementation failure, but it leaves the Sprint 65 spec text inconsistent with the current E2E policy and evidence trail."
    required_fix: "Update SCENARIO-ETS-PART2-009-SMOKE-NO-PUBLIC-MUTATION-001 to say local OSH or any configured primary IUT, and reserve GeoRobotix for optional advisory probes."

