findings:
  - id: RAZE-ETS64-FALSEPASS-001
    severity: HIGH
    status: OPEN
    title: "event-by-type can PASS using generic SystemEvent type evidence instead of event type evidence"
    risk: "A declaring IUT that ignores eventType filtering but returns SystemEvent resources with a generic type member can produce a false PASS for /conf/advanced-filtering/event-by-type."
    evidence:
      - "Part2AdvancedFilteringSupport.systemEventType() checks eventType, then type, then definition at src/main/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/part2/advancedfiltering/Part2AdvancedFilteringSupport.java:736."
      - "The bundled SystemEvent schema requires definition, label, and time, not eventType or a generic resource type, at src/main/resources/schemas/connected-systems-2/json/systemEvent.json:17."
      - "The referenced SensorML Event schema describes definition as the type of event at src/main/resources/schemas/connected-systems-shared/sensorml/schemas/json/Event.json:11."
      - "The Sprint 64 scenario says the ETS checks eventType filtering using /systemEvents at openspec/capabilities/ets-ogcapi-connectedsystems/spec.md:1348."
      - "The structural test codifies the loose type fallback but does not cover the conflict case where type is generic and definition is the actual event type: src/test/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/part2/advancedfiltering/VerifyPart2AdvancedFilteringTests.java:120."
    required_fix: "Remove the generic type fallback or make definition take precedence over type, and add a regression where a SystemEvent has type=SystemEvent plus definition=<actual-event-uri>; the event-by-type probe must query and validate the actual event type evidence, not the generic resource discriminator."
  - id: RAZE-ETS64-E2E-001
    severity: LOW
    status: OBSERVED
    title: "Local OSH E2E is honest but provides no positive Sprint 64 filter execution"
    risk: "The archived E2E run verifies dependency-skip behavior, TeamEngine wiring, and no mutation, but it does not exercise the new filter predicates against a declaring IUT because all eighteen Sprint 64 methods skip before IUT access."
    evidence:
      - "advanced-filtering-smoke-summary.txt reports method_count 18 and status_counts {'SKIP': 18} with setup skipped because systemsFilterByFeatureOfInterest skipped."
      - "local-osh-smoke.txt reports TestNG total=260 passed=36 failed=21 skipped=203 and exits non-green."
      - "The story, status, changelog, test-results, and contract all describe this as an honest non-green local OSH limitation rather than a green completion claim."
    required_fix: null
  - id: RAZE-ETS64-ARTIFACT-001
    severity: LOW
