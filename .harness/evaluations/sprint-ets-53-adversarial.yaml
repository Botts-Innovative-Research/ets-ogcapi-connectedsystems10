verified_strengths:
  - The pinned release contains exactly the four reviewed Property procedures, and each has one exact mapping.
  - The deployed class declares exactly four independent alwaysRun methods and stores only immutable API-root state.
  - API Common is the direct prerequisite; System is not introduced as an unrelated blocker.
  - Status and actual Content-Type gates precede parsing of Property result pages.
  - Supported pages receive complete local schema validation backed by resolver-normalized parity over the full released graph.
  - Canonical processing validates every occurrence, enforces same-origin Property-path identity, and compares representations after canonical-link-only normalization.
  - Expected media limitations are accumulated narrowly so earlier unsupported collections or items do not hide later inspectable defects.
  - API Common sabotage causally blocks Property setup and all direct methods before Property endpoint execution.
  - No executable SensorML or SWE Common conformance-suite jar is imported.
  - Coverage evidence leaves /conf/sensorml/property-schema at candidate status rather than claiming exact closure.
  - Primary E2E, credential, request-method, runtime, and immutability artifacts are mutually consistent and preserve non-green results.

