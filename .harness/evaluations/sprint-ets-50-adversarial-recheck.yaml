prior_findings:
  - id: RAZE-S50-001
    severity: HIGH
    status: CLOSED
    closure: >-
      ProcedureFeaturesSupport validates every canonical occurrence for a
      non-empty href, same origin, exact encoded Procedure path, and no
      fragment before selecting any candidate. It then selects the first
      occurrence with absent media or media matching the collection page.
      ProceduresTests requests that representation and verifies the negotiated
      response media remains comparable before parsing. No comparable
      occurrence throws SkipException with a requirement-scoped reason.
    evidence:
      - ProcedureFeaturesSupport.java:124-179
      - ProceduresTests.java:95-125
      - VerifyProcedureFeaturesSupport.java:83-122
      - VerifyProceduresHttpProcedures.java:132-144
      - VerifyProceduresHttpProcedures.java:269-283
      - >-
        The focused HTTP regression places text/html first and
        application/geo+json second; the Procedure method completes through
        the later comparable representation.
      - >-
        The unit regression rejects a conflicting later canonical target,
        proving unsupported earlier links do not escape all-target identity
        validation.
      - >-
        The unit regression verifies a canonical set with no comparable
        representation produces SkipException rather than FAIL or PASS.
  - id: RAZE-S50-002
    severity: MEDIUM
    status: CLOSED
    closure: >-
      withoutCanonicalLinks removes the optional links member when canonical
      removal leaves no retained links. Applying the same normalization to a
      canonical-only collection item and a canonical response that omits links
      therefore produces equal JSON trees.
    evidence:
      - ProcedureFeaturesSupport.java:181-207
      - VerifyProcedureFeaturesSupport.java:107-110
      - VerifyProceduresHttpProcedures.java:146-158
      - VerifyProceduresHttpProcedures.java:291-296
      - >-
        The deployed HTTP regression dereferences a canonical response with no
        links member and completes canonical equivalence successfully.
  - id: RAZE-S50-003
    severity: LOW
    status: CLOSED
    closure: >-
      The shipped TestNG comment now states that Sprint 50 moved Procedure from
      historical SystemFeatures inheritance to direct Part 1 API Common
      inheritance. The executable group dependency and structural lint agree.
    evidence:
      - testng.xml:53-58
      - testng.xml:176-180
      - VerifyTestNGSuiteDependency.java:595-677

