success_criteria:
  - All five released Subdeployment procedures have exact reviewed mappings.
  - Every hierarchy and result page is processed through bounded same-origin traversal.
  - HTTP status and actual media are established before parsing hierarchy evidence.
  - GeoJSON and SensorML pages use released Deployment collection schemas.
  - Duplicate IDs, cycles, shortcut edges, and safety-bound violations fail.
  - Every rel=subdeployments occurrence resolves to the exact normative target.
  - Recursive accepts exact boolean true and false values.
  - Root default and false results equal roots; true equals all nodes.
  - Child default and false results equal direct children; true equals all descendants.
  - Advertised parent associations include explicit parent-owned and descendant-owned fixture resources.
  - Missing independent ownership evidence skips instead of passing.
  - Equivalent default-port and unreserved-encoding targets compare equal.
  - Association selection prefers usable same-origin JSON occurrences.
  - Each procedure retrieves only its own prerequisites.
  - Deployment prerequisite failures cascade before Subdeployment IUT access.
  - Unrelated sibling configurations cannot block Subdeployment.
  - Focused and full Maven verification completes.
  - TeamEngine deploys every changed method against the primary unmodified local OSH IUT.
  - Local OSH conformance failures and inherited skips remain visible and unmodified.
  - A controlled HTTP fixture executes successful positive paths for all five methods.
  - Exact-image runtime, causal dependency, credential, and artifact-hygiene gates complete.
  - Programmatic TestNG output uses disposable temporary storage and leaves no repository-root test-output directory.
  - Raze reports no unresolved required fixes.
guardrails:
  - Do not modify OSH or TeamEngine source code or binaries.
  - Do not add hosted CI.
  - Do not classify SKIP as positive conformance evidence.
  - Do not import ets-sensorml30 or expose external validator types to TestNG procedures.
