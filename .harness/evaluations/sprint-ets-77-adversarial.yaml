      - "_bmad/traceability.md:96 says IMPLEMENTED_DOCS_PENDING_RAZE."
    impact: >
      The reconciled status files disagree on completion state. This is exactly
      the kind of false-confidence bookkeeping drift the Raze gate is supposed
      to catch before final closeout.
    required_fix: >
      Change ops/status.md to a Raze-pending/in-progress Sprint 77 heading until
      required fixes are applied and Raze is rerun. After re-review, reconcile
      CP, story, contract, traceability, status, test-results, and changelog to
      the final Raze verdict without implying the package was filed upstream.
