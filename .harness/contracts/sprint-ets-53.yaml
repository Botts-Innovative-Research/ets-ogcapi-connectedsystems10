success_criteria:
  - All four released Property Definitions procedures have exact reviewed mappings.
  - Every procedure retrieves only its own evidence and has no method dependency.
  - Every page is status and actual-media gated before parsing.
  - Pagination is bounded, cycle-safe, and same-origin.
  - Supported Property pages pass the released SensorML Property collection schema.
  - The undefined released sensorml-mediatype token is interpreted as application/sml+json.
  - Resolver-normalized bundled Property schemas prove pinned-source semantic and transitive-reference parity.
  - At least one exact sosa:Property collection is advertised with a nonempty id.
  - Every supported collection item has same-origin canonical identity and equivalent content.
  - Missing collections, empty items, and unsupported representations cannot produce vacuous PASS.
  - API Common prerequisite failures cascade before Property IUT access.
  - System and unrelated sibling configurations cannot block Property Definitions.
  - SensorML validation remains behind an ETS-owned replaceable adapter boundary.
  - Reused schema validation does not claim closure of /conf/sensorml/property-schema.
  - Focused and full Maven verification completes.
  - TeamEngine deploys every changed method against the primary unmodified local OSH IUT.
  - Local OSH conformance failures and evidence SKIPs remain visible and unmodified.
  - Controlled HTTP coverage executes successful positive paths for all four methods.
  - Exact-image runtime, credential, dependency, and artifact-hygiene gates complete.
  - Raze reports no unresolved required fixes.
guardrails:
