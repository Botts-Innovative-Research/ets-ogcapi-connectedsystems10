findings:
  - id: RAZE-ETS71-EVIDENCE-001
    severity: LOW
    status: NON_BLOCKING
    title: Copied raw local OSH artifact manifest is not self-verifying from the renamed repository evidence subset.
    impact: >
      Running sha256sum against local-osh-artifact-manifest.sha256 inside the
      repository evidence directory fails because that manifest belongs to the
      source /tmp run tree and references original filenames and nested result
      paths that were not copied verbatim. This does not invalidate the Sprint
      71 claims because repo-evidence-manifest.sha256 verifies the archived
      repository subset in place, and the original /tmp artifact-manifest.sha256
      currently verifies at the path recorded in local-osh-output-dir.txt.
    evidence:
      - path: ops/test-results/sprint-ets-71-part2-update-method-surface-2026-08-02/local-osh-artifact-manifest.sha256
        observed: References source-run paths such as clean-primary-failures.json and populated-results/... that are not all present under the renamed repository evidence subset.
      - command: "cd ops/test-results/sprint-ets-71-part2-update-method-surface-2026-08-02 && sha256sum -c local-osh-artifact-manifest.sha256 --quiet"
        observed: "exit 1; 31 listed files could not be read from the repository evidence directory."
      - command: "cd ops/test-results/sprint-ets-71-part2-update-method-surface-2026-08-02 && sha256sum -c repo-evidence-manifest.sha256 --quiet"
        observed: "exit 0; repository evidence manifest verifies in place."
      - command: "cd /tmp/ets-ogcapi-connectedsystems10-sprint-ets-71-update-20260802T153902Z && sha256sum -c artifact-manifest.sha256 --quiet"
        observed: "exit 0; source local OSH output manifest verifies while the /tmp tree exists."
    required_fix: null
