    status: required_fix
    summary: The archived git-diff whitespace gate is a false PASS because intended untracked artifacts were not included, and one untracked release file has trailing whitespace.
    evidence:
      - ops/test-results/sprint-ets-82-release-packaging-polish-2026-08-04/git-diff-check.txt:1 says git diff --check produced no whitespace errors.
      - git status --short --untracked-files=all shows the Sprint 82 package files and evidence are still untracked, so plain git diff --check did not inspect them.
      - A direct untracked-file whitespace scan found trailing blanks in ops/release/current-release-readiness.md:3 and ops/release/current-release-readiness.md:4.
    impact: The sprint can falsely record a clean diff gate while the actual commit candidate would fail once untracked files are staged.
    required_fix: Remove the trailing spaces or replace them with normal Markdown line separation, then rerun the whitespace gate against the complete intended commit contents.
