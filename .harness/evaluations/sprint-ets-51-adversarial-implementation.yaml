  summary: >-
    Sprint 51 correctly inventories the five released Subdeployment tests,
    applies actual-media gates before parsing every Deployment hierarchy page,
    validates every such page with the released Deployment collection schema,
    fails closed on malformed hierarchy evidence, isolates unrelated TestNG
    siblings, preserves honest local-OSH failures and inherited skips, and
    leaves OSH, TeamEngine, and hosted CI untouched. Approval is withheld for
    four material gaps. The recursive-association oracle omits resources owned
    by the parent Deployment, the direct sabotage run is not causal because
    Deployment already fails in the baseline, exact link comparison can reject
    semantically equivalent target URLs, and association-link selection can
    choose an unsupported first representation despite a usable later link.
    These defects invalidate the current 5/5 exact mapping claim.

