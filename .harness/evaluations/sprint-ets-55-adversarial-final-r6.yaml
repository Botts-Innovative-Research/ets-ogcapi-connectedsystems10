findings:
  - id: "RAZE-S55-R6-EXACT-RELATION-VOCABULARY-001"
    severity: "HIGH"
    required: true
    title: "Direct relation matching still admits non-canonical field and ogc-rel suffix aliases"
    affected_procedures:
      - "/conf/advanced-filtering/system-by-parent"
      - "/conf/advanced-filtering/system-by-procedure"
      - "/conf/advanced-filtering/deployment-by-parent"
      - "/conf/advanced-filtering/sf-by-foi"
      - "/conf/advanced-filtering/combined-filters"
    evidence:
      - "CP-015 lines 85-90 and SCENARIO-ETS-PART1-009-RELEASED-ASSOCIATION-PATHS-001 require exact direct names and exact ogc-rel compact names, and explicitly prohibit field suffix matching."
      - "AdvancedFilteringSupport.java:1387-1393 normalizes every field by lowercasing and deleting all non-alphanumerics, then unconditionally removes a trailing 'link' token before alias comparison."
      - "Consequently, non-released fields such as parentSystemLink, parent-system-link, and systemKindLink match the canonical aliases parentsystem or systemkind."
      - "AdvancedFilteringSupport.java:1395-1405 sends both a direct links[].rel value and an ogc-rel scheme-specific part through the same lossy field matcher. Thus ogc-rel:parentSystemLink and punctuation/case variants also match the canonical parentSystem relation."
      - "AdvancedFilteringSupport.java:1506-1515 retains broad representation aliases including parent and procedure. A root or immediate GeoJSON properties field named parent can satisfy parentSystem or parentDeployment, and procedure can satisfy systemKind, although the released mappings prescribe links with exact relation names, properties/systemKind@link, SensorML attachedTo, or SensorML typeOf."
      - "The R6 positive regressions prove ogc-rel:parentSystem, ogc-rel:parentDeployment, ogc-rel:sampleOf, systemKind@link, attachedTo, and typeOf. The negative regressions cover unrelatedParent, a nested parentSystem, custom:parentSystem, and custom:NotSystem, but do not cover an alias plus the stripped Link suffix or a near-miss ogc-rel scheme-specific part."
      - "The pinned released Part 1 source lists exact link relation values ogc-rel:parentSystem, ogc-rel:parentDeployment, and ogc-rel:sampleOf; its representation tables map GeoJSON systemKind to properties/systemKind@link and SensorML systemKind/parentSystem to typeOf/attachedTo."
    impact: "A response with a non-released direct field or relation can manufacture local-ID and UID association evidence, allowing a mandatory association or combined-filter procedure to PASS when the released representation does not carry the prescribed association."
    required_fix: "Replace lossy shared alias normalization with representation-aware exact matching. Accept only the exact direct member names and exact relation values authorized for that representation and relation; do not remove a generic Link suffix. Add controlled regressions proving parentSystemLink, systemKindLink, ogc-rel:parentSystemLink, punctuation/case near-misses, and broad parent/procedure aliases cannot seed or validate predicates while the exact released forms still pass."

