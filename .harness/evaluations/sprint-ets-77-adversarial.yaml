    title: Upstream package omits Sprint 76 exact blockers for Part 1 CRD and Part 2 Update condition readiness.
    evidence:
      - "REQ-ETS-CLEANUP-028 requires exact conformance-declaration blockers in openspec/capabilities/ets-ogcapi-connectedsystems/spec.md:3372-3376 and SCENARIO-ETS-CLEANUP-CSGO-UPSTREAM-GAP-PACKAGE-001 requires exact missing/inconclusive declarations at lines 3404-3407."
