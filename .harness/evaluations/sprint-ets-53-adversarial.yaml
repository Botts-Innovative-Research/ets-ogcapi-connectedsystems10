findings:
  - id: RAZE-S53-001
    severity: LOW
    status: NON_BLOCKING
    category: parity_provenance_hardening
    title: The parity script reports but does not independently verify its pinned source commit
    summary: >-
      scripts/property-schema-parity.py hard-codes the expected source commit in its
      output but does not fail when the supplied release checkout has a different
      HEAD or dirty source files. The current Sprint 53 parity result remains valid
      because this review independently verified that the supplied checkout is clean
      at the exact pinned commit.
    impact: >-
      A future operator could run the script against the wrong checkout while
      producing an artifact that still names the pinned commit. This is a provenance
      weakness, not a defect in the currently reviewed schema graph or result.
    evidence:
      - >-
        scripts/property-schema-parity.py declares SOURCE_COMMIT and serializes it
        without invoking git rev-parse or checking checkout cleanliness.
      - >-
        Independent review verified /tmp/ogcapi-connected-systems-s52-release HEAD as
        8e03b236a049849f2ccc24b4fd9fdce5ff69bed2 with a clean worktree.
      - >-
        The reviewed parity artifact reports three entry schemas, 53 transitive
        schemas, and zero graph or semantic mismatches.
      - >-
        The script removes only expected local $id values, normalizes equivalent $ref
        forms, and otherwise compares the complete resolver-reachable schema graph.
    required_fixes: []

  - id: RAZE-S53-002
    severity: LOW
    status: NON_BLOCKING
    category: regression_coverage_hardening
    title: Property-specific HTTP tests rely on shared traversal tests for pagination coverage
    summary: >-
      The nine Property-specific controlled HTTP tests exercise the four procedures,
      actual-media ordering, schema failure, canonical identity and equivalence, and
      collection continuation, but they do not include a Property fixture with a
      later page or an explicit first-item limitation followed by a later-item defect.
      Shared traversal tests cover pagination, cycles, cross-origin next links, and
      later-page media limitations, while code inspection confirms the Property loops
      preserve collection and item continuation.
    impact: >-
      Current behavior is supported by shared-helper tests and direct implementation
      inspection, but a future Property-specific integration regression could require
      more diagnosis than a dedicated fixture would.
    evidence:
      - >-
        VerifyPropertyDefinitionsHttpProcedures contains nine direct tests, including
        unsupported actual media before parse, invalid schema, canonical content
        difference, canonical media limitation, links omission normalization, and a
        later invalid collection after an unsupported collection.
      - >-
        Part1ApiCommonSupport traversal tests cover bounded pagination, cycle
        detection, cross-origin next links, and later-page actual-media behavior.
      - >-
        PropertyDefinitionsTests catches expected evidence-limitation SkipException
        values at collection and item boundaries, continues inspectable evidence, and
        does not downgrade status, schema, identity, pagination, or assertion defects.
    required_fixes: []

