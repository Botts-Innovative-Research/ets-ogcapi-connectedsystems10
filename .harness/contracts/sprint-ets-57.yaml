success_criteria:
  - Exactly five independent TestNG methods map the five released procedures.
  - API Common is the only direct TestNG prerequisite and no method uses alwaysRun.
  - Every method checks exact declarations, condition, and mutation ownership before writes.
  - The exact ogcapi-4 Update inheritance URI is required and near-matches are rejected.
  - Canonical and every advertised applicable custom item endpoint are discovered with bounded same-origin pagination and exercised.
  - OPTIONS returns 200 and advertises PATCH.
  - Every implemented JSON Merge Patch and JSON Patch format advertised by Accept-Patch or exact OpenAPI metadata is exercised without treating resource media types as patch documents.
  - HTTP 200, 202, and 204 require completed representation evidence.
  - Changed-field, preserved-sentinel, stable-identity, and ignored-id behavior are proven.
  - Custom occurrence and canonical propagation remain jointly true for two consecutive complete observations.
  - Canonical and custom occurrence evidence uses each endpoint's own pre-update sentinel baseline.
  - Queued work is bounded by one monotonic deadline.
  - Fixture acquisition denial or unusable response is an inconclusive SKIP before PATCH.
  - Canonical Sampling Feature acquisition owns a parent System and uses the required System-scoped child endpoint.
  - Every dispatched POST is rediscovered by bounded canonical and custom identity polling after ambiguous failure.
  - Delayed and custom-only committed resources are cleaned.
  - Canonical-first and custom-delayed ambiguous commits keep both identity views under bounded polling and are cleaned.
  - Released GeoJSON features and JSON or SensorML items collection members are both eligible for identity rediscovery.
  - Failure of one discovery view does not suppress another independently safe discovery or cleanup route.
  - HTTP 201 or 202 without a usable safe owned target is an inconclusive SKIP before PATCH after bounded rediscovery.
  - Owned resources are identity-revalidated and disappearance-proven in reverse-order cleanup.
  - Failure on one cleanup route does not suppress remaining safe cleanup routes.
  - Only exact compact or canonical SOSA collection types authorize custom writes.
  - Repeated Allow fields are combined before PATCH readiness is decided.
  - Controlled HTTP covers every positive procedure and key fail-closed branch.
  - Focused and full Docker Maven verification complete.
  - TeamEngine executes the candidate against unmodified local OSH.
  - Released-source, exact-image runtime, dependency, credential, immutable-base, and hygiene gates complete.
  - Positive real-IUT PATCH evidence is required before exact mapping promotion.
  - Raze reports no unresolved required fixes.
guardrails:
  - Do not modify OSH or TeamEngine source code or binaries.
  - Do not add hosted CI.
  - Do not classify prerequisite or no-patch-format SKIP as positive conformance evidence.
  - Do not mutate a shared public IUT.
  - Do not import executable conformance-suite jars as libraries.
  - Do not guess application/json as a patch-document media type.
