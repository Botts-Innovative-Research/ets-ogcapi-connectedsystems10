findings:
  - id: "RAZE-S55-R5-CANONICAL-RELATION-VOCABULARY-001"
    severity: "HIGH"
    required: true
    title: "The R4 relation-boundary fix rejects released canonical ogc-rel association values"
    affected_procedures:
      - "/conf/advanced-filtering/system-by-parent"
      - "/conf/advanced-filtering/system-by-procedure"
      - "/conf/advanced-filtering/deployment-by-system"
      - "/conf/advanced-filtering/deployment-by-parent"
      - "/conf/advanced-filtering/sf-by-system"
      - "/conf/advanced-filtering/sf-by-sample-of"
    evidence:
      - "AdvancedFilteringSupport.java:1389-1402 treats an absolute relation URI only through getPath() or getFragment()."
      - "Java URI parsing independently reproduced ogc-rel:parentSystem as an absolute opaque URI with null path and fragment and scheme-specific part parentSystem."
      - "The released Part 1 source defines association link relations with the ogc-rel: prefix; its GeoJSON mappings use values including ogc-rel:parentSystem, ogc-rel:parentDeployment, and ogc-rel:sampleOf."
      - "The new focused fixtures use bespoke direct fields/relations such as parentSystem and procedure, so they do not exercise the released compact relation vocabulary."
      - "The System GeoJSON mapping uses systemKind@link for the Procedure association, while the implementation aliases are procedure and typeOf; this positive released mapping is also absent from the fixtures."
    impact: "A conforming IUT can be falsely SKIPped for mandatory association filters because valid direct association evidence is never collected."
    required_fix: "Recognize only the released direct compact relation vocabulary, including the exact ogc-rel scheme-specific association name and exact mapped field names such as systemKind@link, while retaining rejection of suffix aliases and nested extension aliases. Add positive GeoJSON and SensorML fixtures drawn from the released mappings."

  - id: "RAZE-S55-R5-DEPLOYED-SYSTEM-TYPE-GATE-001"
    severity: "HIGH"
    required: true
    title: "Deployment target validation is neither complete nor exclusive for released System representations"
    affected_procedure:
      - "/conf/advanced-filtering/prop-by-deployed-system"
    evidence:
      - "AdvancedFilteringSupport.java:1009-1015 accepts a GeoJSON Feature when normalized featureType merely ends with system, or root type physicalsystem/system."
      - "Released GeoJSON System feature types include sosa:System, sosa:Sensor, sosa:Actuator, sosa:Sampler, and sosa:Platform."
      - "Released SensorML System classes include PhysicalComponent, PhysicalSystem, SimpleProcess, and AggregateProcess."
      - "The current gate rejects valid Sensor, Actuator, Sampler, Platform, PhysicalComponent, SimpleProcess, and AggregateProcess representations."
      - "The endsWith(system) rule accepts an unrelated value such as custom:NotSystem."
      - "R5 fixtures cover only sosa:System as positive and sosa:Deployment plus a collection as negative."
    impact: "Valid deployed-System evidence can be falsely SKIPped, while an unrelated Feature type can seed a false PASS."
    required_fix: "Use media-aware released System representation validation consistent with the official schemas and the suite's SystemFeaturesSupport allowlists, require one object, and add fixtures for every allowed class plus an adversarial non-System suffix type."

  - id: "RAZE-S55-R5-IGNORED-REPRESENTATION-VALIDATION-001"
    severity: "HIGH"
    required: true
    title: "Two mandatory procedures ignore failed released representation validation"
    affected_procedures:
      - "/conf/advanced-filtering/prop-by-object"
      - "/conf/advanced-filtering/combined-filters"
    evidence:
      - "AdvancedFilteringSupport.java:305-310 calls validateEndpoint for prop-by-object but ignores its boolean result."
      - "AdvancedFilteringSupport.java:343-350 does the same for every combined-filter response."
      - "The association path at AdvancedFilteringSupport.java:639-643 demonstrates that false is intended to stop procedure evidence."
      - "The generic reader accepts application/json, while released endpoint validators can return false for an unsupported representation."
    impact: "A generic JSON response containing matching fields can satisfy the filter predicates and PASS without satisfying the exact released representation boundary."
    required_fix: "Treat validateEndpoint=false as non-evidence with a precise fail-closed outcome in both paths, and add unsupported-media fixtures proving that matching generic JSON cannot PASS."

  - id: "RAZE-S55-R5-KEYWORD-MAPPING-OVERCLAIM-001"
    severity: "MEDIUM"
    required: true
    title: "The exact ATS mapping claims a selected-seed assertion that the implementation does not make"
    affected_procedure:
      - "/conf/advanced-filtering/resource-by-keyword"
    evidence:
      - "reviewed-ats-mappings.json:515-520 and the generated ats-coverage-report.json say all returned resources plus the selected seed must contain the keyword."
      - "AdvancedFilteringSupport.java:148-160 reduces discovery to a keyword String, does not retain the selected resource identity, and checks only non-empty returned results and their text."
      - "The released ATS requires keyword behavior but does not require selected-seed inclusion, so this is an evidence-description overclaim rather than a released requirement."
    impact: "The reviewed exact mapping and generated coverage report are not faithful descriptions of the mapped implementation."
    required_fix: "Remove the selected-seed claim from the reviewed mapping and regenerate the synchronized coverage report, or implement and test that additional assertion if it is intentionally retained as project policy."

