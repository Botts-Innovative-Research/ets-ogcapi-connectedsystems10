finding_dispositions:
  - id: RAZE-S51-001
    original_severity: HIGH
    disposition: CLOSED
    title: Parent-plus-descendant association oracle remains independent and complete
    evidence:
      - >-
        SubdeploymentsSupport.java:201-250 parses explicit JSON fixture
        evidence independently of IUT association responses and rejects
        malformed, duplicate, blank, and over-bound evidence.
      - >-
        SubdeploymentsSupport.java:540-552 requires relation evidence for the
        parent plus every hierarchy descendant and returns their complete ID
        union.
      - >-
        SubdeploymentsTests.java:201-242 retrieves only the parent association
        endpoint for comparison; incomplete independent evidence SKIPs and an
        observed omission fails.
      - >-
        VerifySubdeploymentsHttpProcedures.java:153-183 independently proves
        both descendant-owned and parent-owned omissions fail while missing
        fixture evidence SKIPs.
    conclusion: >-
      A response containing every descendant-owned ID but omitting a known
      parent-owned ID cannot pass.

  - id: RAZE-S51-002
    original_severity: MEDIUM
    disposition: CLOSED
    title: Causal single-variable TestNG dependency proof remains valid
    evidence:
      - >-
        VerifySubdeploymentsCausalDependency.java:49-72 first runs a passing
        synthetic Deployment prerequisite, proves all five procedures start
        and reach the IUT, then changes only that prerequisite to fail and
        proves the exact five methods SKIP with zero sabotage-side IUT calls.
      - >-
        VerifySubdeploymentsCausalDependency.java:116-165 captures the injected
        failure, all method skips, and the blocker reason through programmatic
        TestNG listeners.
      - >-
        sprint-ets-51-raze-hygiene-focused-final-2026-07-27.log records the
        causal class as 1/0/0/0 and the focused gate as 131/0/0/0.
      - >-
        All canonical records classify the direct local-OSH Deployment
        sabotage as historical and non-causal because Deployment already
        failed in its baseline.
    conclusion: >-
      The controlled baseline/sabotage pair isolates one variable and supplies
      the causal proof that the local-OSH sabotage could not provide.

  - id: RAZE-S51-003
    original_severity: MEDIUM
    disposition: CLOSED
    title: Equivalent HTTP target forms remain normalized
    evidence:
      - >-
        SubdeploymentsSupport.java:407-466 compares case-insensitive
        scheme/host, effective default port, normalized path, and decoded
        percent-encoded unreserved characters while rejecting query and
        fragment variants.
      - >-
        VerifySubdeploymentsSupport.java:85-118 retains wrong-target rejection
        and accepts explicit port 80 plus host-case and percent-encoding
        equivalence.
      - >-
        VerifySubdeploymentsHttpProcedures.java:212-223 executes the equivalent
        percent-encoded target through the production collection procedure.
    conclusion: >-
      Semantically equivalent default-port and unreserved-encoding target URLs
      do not receive a lexical false failure.

  - id: RAZE-S51-004
    original_severity: MEDIUM
    disposition: CLOSED
    title: Association selection continues to inspect all occurrences safely
    evidence:
      - >-
        SubdeploymentsSupport.java:149-186 scans every occurrence, refuses
        unsafe candidates, separates typed JSON-compatible and untyped
        candidates, ignores unsupported types, and deterministically prefers a
        typed usable candidate.
      - >-
        VerifySubdeploymentsSupport.java:120-148 proves that cross-origin and
        same-origin HTML occurrences cannot hide a later usable same-origin
        JSON occurrence.
      - >-
        VerifySubdeploymentsHttpProcedures.java:186-209 proves the production
        path dereferences the later usable endpoint and SKIPs when no safe
        comparable endpoint exists.
    conclusion: >-
      An unsafe or unsupported first occurrence cannot hide a usable later
      association representation.

  - id: RAZE-S51-GF-001
    original_severity: MEDIUM
    disposition: CLOSED
    title: Programmatic TestNG no longer pollutes repository-root test-output
    evidence:
      - >-
        VerifySubdeploymentsCausalDependency.java:38-40 uses JUnit
        TemporaryFolder; lines 53-63 allocate distinct baseline and sabotage
        directories beneath it.
      - >-
        VerifySubdeploymentsCausalDependency.java:75-90 explicitly sets the
        TestNG output directory, disables default listeners, and confines
        generated reports to disposable test storage.
      - >-
        VerifySubdeploymentsCausalDependency.java:70-71 executes a regression
        assertion that repository-root test-output is absent after both nested
        TestNG runs.
      - >-
        The corrected focused 131/0/0/0 and full 480/0/0/3 logs execute that
        regression successfully; repository-root test-output was absent during
        this final review.
      - >-
        Independent snapshot /tmp/ets-s51-final-clean-source remains at commit
        57c0c94e6461f84164cc941e476103a9fcdea1fa with empty git status and no
        repository-root test-output after clean full Maven 480/0/0/3. Build
        output is confined to ignored target/.
    conclusion: >-
      Focused, full, and independently committed clean-snapshot Maven evidence
      establishes zero repository-root TestNG report pollution.

  - id: RAZE-S51-GF-002
    original_severity: MEDIUM
    disposition: CLOSED
    title: Canonical records use corrected final evidence and honest causality
    evidence:
      - >-
        The capability spec, story, contract, architecture, traceability,
        status, changelog, test-results index, durable verification summary,
        and generator handoff all use focused 131/0/0/0 and full 480/0/0/3.
      - >-
        Full final image identity
        sha256:e88aa5f94ce98d474b66168fbe95ccd6ef574511bce910142acb38a5484b1dca
        is recorded in the handoff, durable verification summary, and runtime
        evidence; abbreviated narrative references consistently identify the
        same e88aa5f9...b1dca image.
      - >-
        Every canonical Sprint 51 record reports local OSH honestly as
        219/39/5/175, keeps five genuine Deployment/Procedure failures visible,
        and classifies all five Subdeployment outcomes as inherited pre-IUT
        SKIPs.
      - >-
        Every canonical record uses the controlled programmatic TestNG
        baseline/sabotage pair as causal dependency evidence and classifies the
        earlier direct local-OSH Deployment sabotage as historical,
        non-causal, and ineligible as closure proof.
      - >-
        Active Sprint 51 canonical sections contain no superseded aa44f0d8 or
        197ec2a2 image claim and no 121/0/0/0 or 473/0/0/3 completion claim.
        Older artifacts remain only as explicitly superseded historical
        evidence.
    conclusion: >-
      A release reader can identify one coherent final Sprint 51 evidence set
      without relying on the disproven local-OSH sabotage.

