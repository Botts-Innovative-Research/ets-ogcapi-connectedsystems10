    title: "cmdschema-mapping can skip a present but noncanonical IssueTime mapping instead of failing"
    affected_requirements:
      - "REQ-ETS-PART2-011"
      - "SCENARIO-ETS-PART2-011-SCHEMA-MAPPING-TIME-001"
      - "/conf/swecommon-text/cmdschema-mapping"
    evidence:
      - "openspec/capabilities/ets-ogcapi-connectedsystems/spec.md:1744-1749 says Command schema mapping PASS requires the same canonical IssueTime definition evidence required by /req/swecommon-json/cmdschema-mapping, and PASS must come from retrieved recordSchema evidence."
      - "epics/stories/s-ets-67-01-part2-swecommon-text-closure.md:36 says mapping procedures require canonical Time and IssueTime definition evidence from retrieved recordSchema content."
      - "src/main/java/.../Part2SweCommonTextTests.java:269-275 retrieves the Command Schema recordSchema, calls containsIssueTimeComponentWithCanonicalDefinition, and throws SkipException whenever the helper returns false."
      - "src/main/java/.../Part2SweCommonTextTests.java:400-402 only searches for any Time component with the canonical IssueTime definition; it does not distinguish absent IssueTime evidence from an issueTime-like Time component with a missing or wrong definition."
      - "src/test/java/.../VerifyPart2SweCommonTextTests.java:191-202 already proves named issueTime without the canonical definition returns false, but the runtime method maps that false value to SKIP rather than FAIL."
      - "src/main/resources/.../ats/reviewed-ats-mappings.json:1667-1672 states that if issue-time evidence is present, it must use the canonical issue-time definition; the current runtime path does not enforce that present-but-wrong case."
    impact: "A reachable Command Schema can expose an issueTime-like SWE Time component with a missing or noncanonical definition and receive prerequisite-incomplete SKIP instead of a conformance failure. That is a false-SKIP risk under the exact released ATS closure."
    required_fix: "Add runtime logic and focused structural coverage that distinguish absent IssueTime evidence from present-but-noncanonical IssueTime evidence. SKIP only when IssueTime mapping evidence is truly absent; FAIL when a retrieved Command Schema exposes issueTime/IssueTime evidence that is not a SWE Time component with definition http://www.opengis.net/def/property/OGC/0/IssueTime. Then update reviewed mapping evidence if needed and rerun focused verification."
    closure_evidence:
