findings:
  - id: RAZE-ETS63-DOC-001
    severity: MEDIUM
    category: premature_completion_wording
    status: OPEN
    summary: Several reconciliation docs mark Sprint 63 complete while Raze and push remain pending.
    evidence:
      - epics/stories/s-ets-63-01-part2-system-event-closure.md:3 says "Status: Complete".
      - epics/stories/s-ets-63-01-part2-system-event-closure.md:71 leaves Raze review unchecked.
      - epics/stories/s-ets-63-01-part2-system-event-closure.md:72 leaves push unchecked.
      - ops/status.md:5 says "Sprint 63 Complete" while ops/status.md:49 says Raze review and commit/push are still pending.
      - epics/epic-ets-03-part2-classes.md:32 says "Complete" and "Raze pending" in the same row.
      - openspec/change-proposals/CP-023-part2-system-event-closure.md:3 says "Implemented in Sprint 63" while the verification plan at line 56 requires Raze before completion wording.
      - .harness/contracts/sprint-ets-63.yaml:4 correctly keeps status at IMPLEMENTED_PENDING_RAZE_AND_PUSH.
    impact: >
      The implementation may be technically close, but project state is already
      advertising completion before the mandatory Raze and push gates are closed.
      That creates false handoff confidence and repeats the stale completion
      pattern caught in prior Part 2 closures.
    required_fix: >
      Replace premature "Complete" wording with an explicit pending-gate state
      in story, status, epic, and CP text until this Raze report has no
      unresolved required fixes and the push is complete.
  - id: RAZE-ETS63-EVIDENCE-001
    severity: MEDIUM
    category: unverified_maven_claims
    status: OPEN
    summary: Focused, coverage, formatter, and full Maven totals are claimed but no durable Sprint 63 Maven artifacts are tracked.
    evidence:
      - epics/stories/s-ets-63-01-part2-system-event-closure.md:44-51 claims test-first red, corrected focused 84/0/0/0, coverage update/audit, and full Docker Maven 763/0/0/3.
      - ops/status.md:28-33 repeats the same verification totals.
      - ops/test-results.md:20-30 repeats the same verification totals.
      - "find ops/test-results/sprint-ets-63-part2-system-event-2026-08-01 -maxdepth 2 -type f shows only E2E/no-mutation/runtime files, not Maven logs."
      - No tracked ops/test-results Sprint 63 Maven log was found for the focused red, corrected focused run, coverage update/audit, formatter, or full Docker Maven run.
    impact: >
      E2E/no-mutation evidence is durable and inspectable, but the Maven gate
      claims are not independently auditable from repository artifacts. A later
      reviewer cannot distinguish a real pass from a copied stale total without
      rerunning expensive gates.
    required_fix: >
      Archive the Sprint 63 focused red/corrected focused, coverage update,
      coverage audit, formatter, and full Docker Maven console outputs under the
      Sprint 63 evidence directory and update story/status/test-results to point
      at those files. If the logs were not captured, rerun the missing gates and
      archive fresh output before final completion.
