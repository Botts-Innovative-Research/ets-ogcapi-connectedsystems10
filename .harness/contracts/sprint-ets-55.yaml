success_criteria:
  - Exactly 25 independent TestNG methods map the 25 released procedures.
  - Each method acquires only its own evidence and uses alwaysRun.
  - API Common failures cascade before Advanced Filtering IUT access.
  - System and sibling configurations cannot block Advanced Filtering.
  - Local-ID, UID, and UID-prefix ID filters cover every declared canonical endpoint.
  - Keyword filters use only resource-boundary name, description, or SensorML label content.
  - Recommendation non-support produces warnings rather than conformance failures.
  - Geometry filters use parsed WKT and GeoJSON intersection.
  - Association filters validate every returned resource through released representation boundaries.
  - Procedure-specific association paths cannot be replaced by root aliases or wrapper identifiers.
  - Canonical GeoJSON direct and ogc-rel compact relation names, systemKind@link, and SensorML attachedTo/typeOf mappings remain accepted.
  - GeoJSON links[].rel values cannot create SensorML association evidence; SensorML System parent and Procedure evidence uses only attachedTo and typeOf.
  - Every released GeoJSON and SensorML System class is accepted as a deployed-System target, while arbitrary suffix types are rejected.
  - Property object-type and combined-filter responses pass released representation validation before predicate evidence is accepted.
  - Keyword mapping evidence does not claim selected-seed inclusion.
  - Mandatory known-match queries cannot pass with empty results.
  - Combined filters enumerate every applicable inherited, mandatory class-specific, and positively supported custom predicate.
  - Combined filters prove every returned resource satisfies every supplied predicate.
  - Indirect recommendation checks compare complete result sets transitively.
  - Pagination is bounded, cycle-safe, and same-origin.
  - Cross-origin association targets receive no IUT credential.
  - Focused and full Maven verification completes.
  - TeamEngine deploys every changed method against unmodified local OSH.
  - Controlled HTTP covers all positive procedures and key fail-closed branches.
  - Exact-image runtime, credential, dependency, and artifact-hygiene gates complete.
  - All 25 ATS mappings are reviewed exact.
  - Raze reports no unresolved required fixes.
