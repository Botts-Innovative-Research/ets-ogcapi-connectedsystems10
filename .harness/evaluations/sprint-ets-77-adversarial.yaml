      - "The JSON companion mirrors only those blockers in ops/outreach/connected-systems-go-readiness-gap-request.json:49-74."
      - "Sprint 76 readiness-summary.json also records missing Part 1 CRD URI http://www.opengis.net/spec/ogcapi-connectedsystems-1/1.0/conf/create-replace-delete, missing exact inherited Part 1 prerequisite http://www.opengis.net/spec/ogcapi-4/1.0/conf/create-replace-delete, and missing Part 2 condition class http://www.opengis.net/spec/ogcapi-connectedsystems-2/1.0/conf/feasibility at ops/test-results/sprint-ets-76-connected-systems-go-readiness-2026-08-03/readiness-summary.json:13-19 and :59-67, repeated at :92-98 and :139-146."
    impact: >
      A maintainer filing based on the current package would likely miss blockers
      required for all-47-candidate exact-use planning, especially Part 1 CRD
      and Part 2 Update readiness. This is documentation-only, but it undermines
      the sprint's stated purpose of avoiding future raw-log reinterpretation.
    required_fix: >
      Update the Markdown and JSON outreach artifacts, plus reconciled spec,
      story, contract, ops status/test-results/changelog/known-issues/product
      brief/traceability text as needed, to explicitly list the missing Part 1
      CRD declaration, exact inherited ogcapi-4 CRD prerequisite, and Part 2
      feasibility condition blocker. Keep the distinction between Part 1 exact
      ogcapi-4 and Part 2 ogcapi-features-4 mappings clear.
  - id: RAZE-ETS77-OPS-001
    severity: MEDIUM
    status: OPEN
    title: ops/status.md prematurely marks Sprint 77 complete while Raze is pending.
    evidence:
      - "ops/status.md:5 says 'Sprint 77 Complete - connected-systems-go Upstream Gap Package'."
      - "CP-037 and S-ETS-77-01 explicitly remain COMPLETE_LIGHTWEIGHT_VERIFIED_RAZE_PENDING at openspec/change-proposals/CP-037-connected-systems-go-upstream-gap-package.md:3-6 and epics/stories/s-ets-77-01-connected-systems-go-upstream-gap-package.md:3-6."
