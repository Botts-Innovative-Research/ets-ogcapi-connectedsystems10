required_findings:
  - id: RAZE-S50-001
    severity: HIGH
    title: First canonical occurrence can create a false conformance failure
    summary: >-
      The released ATS requires each item to include a canonical link, then to
      dereference that link and compare equivalent content. It does not require
      document-order selection when several representation-specific canonical
      links are present. Sprint 50 instead mandates and implements
      dereferencing the first occurrence. A conforming item with an HTML or
      SensorML canonical link first and an equivalent GeoJSON canonical link
      later can therefore be requested with an incomparable media type and
      fail JSON parsing or content comparison despite providing valid
      canonical evidence.
    evidence:
      - >-
        Pinned Annex A lines 600-604 say that a canonical link is included,
        dereferenced with HTTP 200, and compared except for that link; they do
        not prescribe first-in-document-order selection.
      - >-
        openspec/capabilities/ets-ogcapi-connectedsystems/spec.md:638-646
        adds a first-occurrence requirement not present in the released ATS.
      - >-
        ProcedureFeaturesSupport.java:132-170 collects candidates but returns
        candidates.get(0); ProceduresTests.java:106-115 uses that candidate's
        advertised media type for dereference and immediate JSON comparison.
      - >-
        VerifyProcedureFeaturesSupport.java:89-102 and the controlled HTTP
        fixture cover only a supported, comparable first canonical link.
    required_fix: >-
      Reconcile the spec, design, story, and contract to the released ATS.
      Deterministically select a canonical occurrence whose advertised or
      negotiated representation is supported and comparable with the
      collection item, while retaining target-valid identity checks. Add a
      deployed HTTP regression with an unsupported or different-media
      canonical occurrence first and a valid comparable occurrence later.
      Re-review the exact mapping after the regression passes.
    disposition: OPEN

  - id: RAZE-S50-002
    severity: MEDIUM
    title: Canonical-link exclusion does not equate absent and emptied links
    summary: >-
      The canonical URL requirement mandates a canonical relation only when a
      resource is retrieved away from its canonical URL. A canonical response
      may therefore omit its optional links member when the collection item
      contained only the canonical link. The current comparator removes the
      link object but retains an empty links array, then compares it with the
      canonical document that has no links member. This reports a content
      difference caused solely by the ATS-excluded canonical link.
    evidence:
      - >-
        Pinned req_canonical_url.adoc:8 requires the canonical relation only
        for retrieval through a non-canonical URL.
      - >-
        Pinned Annex A line 604 explicitly excludes the canonical link from
        content equivalence.
      - >-
        ProcedureFeaturesSupport.java:173-189 always writes the retained links
        array, including when it becomes empty.
      - >-
        VerifyProcedureFeaturesSupport.java:89-102 keeps links members and
        non-canonical links in both compared documents; no unit or HTTP test
        covers a collection item with only a canonical link and a canonical
        response omitting links.
    required_fix: >-
      Define semantic canonical-link exclusion so a links member emptied only
      by removing canonical relations is equivalent to an omitted links
      member. Add focused and controlled HTTP regressions for this allowed
      representation before restoring the exact mapping claim.
    disposition: OPEN

  - id: RAZE-S50-003
    severity: LOW
    title: Shipped TestNG commentary contradicts the current dependency graph
    summary: >-
      The executable dependency is correct, but the adjacent shipped comment
      still states that Procedure retains its SystemFeatures dependency. This
      contradicts Sprint 50, ADR-010 v5, structural lint, and the actual
      part1apicommon dependency.
    evidence:
      - >-
        testng.xml:53-57 says Procedures retains its SystemFeatures dependency.
      - >-
        testng.xml:178 declares procedures depends-on part1apicommon, and
        VerifyTestNGSuiteDependency explicitly rejects SystemFeatures.
    required_fix: >-
      Correct the stale TestNG comment to identify the historical Sprint 49
      state and the current Sprint 50 direct Part 1 API Common dependency.
    disposition: OPEN

