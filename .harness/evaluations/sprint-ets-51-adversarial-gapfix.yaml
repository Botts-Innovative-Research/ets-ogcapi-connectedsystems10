initial_finding_dispositions:
  - id: RAZE-S51-001
    original_severity: HIGH
    disposition: CLOSED
    title: Independent association oracle includes parent and all descendants
    evidence:
      - >-
        SubdeploymentsSupport.java:201-250 parses the explicit JSON fixture
        independently from IUT association responses and rejects malformed,
        duplicate, blank, and over-bound evidence.
      - >-
        SubdeploymentsSupport.java:540-552 constructs deploymentsToInspect with
        the parent followed by hierarchy.descendants(parent), requires relation
        evidence for every one, and returns their complete ID union.
      - >-
        SubdeploymentsTests.java:201-242 retrieves only the parent association
        endpoint, requires complete fixture evidence, and fails observed
        omissions while missing evidence becomes an explicit SKIP.
      - >-
        VerifySubdeploymentsSupport.java:150-169 proves the parent, child, and
        grandchild union. VerifySubdeploymentsHttpProcedures.java:162-182 and
        428-445 prove parent-owned omission fails while absent fixture evidence
        skips.
    conclusion: >-
      The expected set is no longer derived from descendant endpoint responses,
      and a response containing every descendant ID but omitting the known
      parent-owned ID cannot pass.

  - id: RAZE-S51-002
    original_severity: MEDIUM
    disposition: CLOSED
    title: Causal single-variable dependency experiment covers all five methods
    evidence:
      - >-
        VerifySubdeploymentsCausalDependency.java:41-59 first runs a passing
        synthetic Deployment prerequisite, confirms all five procedure methods
        start and the IUT is reached, resets the request counter, then changes
        only that prerequisite to the marker failure.
      - >-
        VerifySubdeploymentsCausalDependency.java:53-58 requires the marker
        method to fail, the exact five-method set to be skipped, a skip reason
        naming the marker, and zero sabotage-side IUT calls.
      - >-
        The generated causal XML at test-output/testng-results.xml:2-94
        independently exposes one marker FAIL and all five procedure SKIPs with
        the marker named as blocker. This XML is useful causal evidence but its
        repository-root location creates new finding RAZE-S51-GF-001.
      - >-
        sprint-ets-51-raze-gapfix-focused-final-2026-07-27.log records the
        causal test class as 1/0/0/0 and the complete focused gate as
        131/0/0/0. The full gate records 480/0/0/3.
    historical_evidence_disposition: >-
      The earlier local-OSH Deployment sabotage remains non-causal because its
      baseline already failed Deployment. It was not used to close this finding.
    conclusion: >-
      The isolated programmatic TestNG baseline/sabotage pair supplies the
      missing causal proof for setup and all five methods.

  - id: RAZE-S51-003
    original_severity: MEDIUM
    disposition: CLOSED
    title: HTTP target identity normalizes default ports and unreserved encodings
    evidence:
      - >-
        SubdeploymentsSupport.java:407-466 compares case-insensitive scheme and
        host, effective ports 80/443, normalized paths, decoded percent-encoded
        unreserved characters, and requires absent query and fragment.
      - >-
        VerifySubdeploymentsSupport.java:106-118 accepts an omitted-versus-
        explicit port 80 target with host-case and %72 path equivalence.
      - >-
        VerifySubdeploymentsHttpProcedures.java:212-223 and 468-484 execute a
        percent-encoded equivalent target through the production HTTP procedure;
        VerifySubdeploymentsSupport.java:82-104 retains rejection for trailing
        path, query, fragment, wrong parent, and cross-origin variants.
    conclusion: >-
      Equivalent default-port and unreserved-encoding forms no longer receive a
      lexical false failure, while materially different targets still fail.

  - id: RAZE-S51-004
    original_severity: MEDIUM
    disposition: CLOSED
    title: Association selection examines every safe occurrence
    evidence:
      - >-
        SubdeploymentsSupport.java:149-186 scans every matching occurrence,
        discards invalid or cross-origin hrefs, separates typed JSON-compatible
        and untyped candidates, ignores unsupported types, and prefers a typed
        candidate without document-order short-circuiting.
      - >-
        SubdeploymentsSupport.java:291-312 refuses unsafe candidates without
        dereferencing them. SubdeploymentsTests.java:217-241 converts absence of
        a safe comparable candidate to explicit SKIP.
      - >-
        VerifySubdeploymentsSupport.java:120-148 and
        VerifySubdeploymentsHttpProcedures.java:186-210 place cross-origin JSON
        and same-origin HTML occurrences before the usable same-origin JSON
        occurrence, prove the later endpoint is selected, and prove no-safe-link
        behavior skips.
    conclusion: >-
      An unsafe or unsupported first occurrence can no longer hide a usable
      later association representation.

required_findings:
  - id: RAZE-S51-GF-001
    severity: MEDIUM
    disposition: REQUIRED_FIX
    category: worktree_pollution
    title: The causal TestNG proof writes a synthetic failure report into the repository root
    evidence:
      - >-
        git status reports untracked test-output/. .gitignore:1-40 ignores
        target/ and logs but does not ignore test-output/.
      - >-
        test-output/testng-results.xml and test-output/earl-results.rdf were
        written at 2026-07-27T01:57:53Z during the full Maven gate.
      - >-
        test-output/testng-results.xml:2-94 is the synthetic sabotage suite,
        including one intentional FAIL and five SKIPs, rather than a primary ETS
        conformance result.
      - >-
        VerifySubdeploymentsCausalDependency.java:62-76 configures programmatic
        TestNG without an output directory or cleanup boundary; disabling
        default listeners did not prevent the TestNG/EARL files.
      - >-
        The Sprint 51 contract currently records artifact_hygiene as
        PASS_ZERO_WRITES_ZERO_LEAKS, but that gate covers IUT writes and
        credential leakage, not repository pollution.
    impact: >-
      Every focused or full Maven execution can dirty the worktree and leave an
      intentional failing TestNG report where operators or scripts can confuse
      it with suite evidence. This violates the project worktree-hygiene gate.
    required_fix: >-
      Give the programmatic TestNG runs a disposable output directory under an
      ignored build/temp location and remove it in a finally/cleanup path, or
      otherwise suppress all report writers. Remove the current test-output/
      artifacts, add a regression or clean-worktree assertion, and rerun focused
      and full Maven from a clean source copy to prove zero repository writes.

  - id: RAZE-S51-GF-002
    severity: MEDIUM
    disposition: REQUIRED_FIX
    category: evidence_and_spec_reconciliation
    title: Durable records still overclaim the non-causal sabotage and cite superseded gates
    evidence:
      - >-
        openspec/capabilities/ets-ogcapi-connectedsystems/spec.md:2133-2139 and
        2215-2229 still say exact mappings are demoted, all four findings remain
        open, and a fresh technical run is required, while the reviewed mapping
        file:218-259 already restores all five exact mappings and corrected
        technical runs exist.
      - >-
        _bmad/traceability.md:34 cites focused 121/0/0/0, full 473/0/0/3, image
        aa44f0d8, and says direct Deployment sabotage passes. The corrected
        evidence is 131/0/0/0, 480/0/0/3, image 197ec2a2, and the direct
        local-OSH sabotage is explicitly non-causal.
      - >-
        ops/status.md:74-100, ops/test-results.md:5-34, and
        ops/changelog.md:5-49 repeat the superseded counts/image and characterize
        the direct sabotage as proof.
      - >-
        ops/test-results/sprint-ets-51-part1-subdeployment-verification-2026-07-27.md:20-58
        is still the pre-correction durable summary. It records 121/473,
        aa44f0d8, and a passing direct sabotage, and does not enumerate the
        corrected gap-fix artifacts.
      - >-
        By contrast, the contract, story, design, and architecture correctly
        cite 131/0/0/0, 480/0/0/3, 197ec2a2, the causal programmatic experiment,
        and historical/non-causal treatment of the old sabotage. The records
        therefore disagree on the canonical release state.
    impact: >-
      A release reader cannot determine which gates establish Sprint 51. The
      durable verification summary and traceability matrix still present an
      experiment disproven by the initial Raze review as passing dependency
      evidence, violating evidence honesty and spec/code/status agreement.
    required_fix: >-
      Reconcile the capability status, exact-mapping language, story, contract,
      epic, traceability, status, changelog, test-results index, and durable
      Sprint 51 verification summary to the corrected artifacts. Cite focused
      131/0/0/0, full 480/0/0/3, image
      sha256:197ec2a29ce823b1614faf1d54698b01206d35f4ad2ae0dca4653aed43367ec7,
      local OSH 219/39/5/175, and the causal programmatic TestNG proof. Label
      every direct local-OSH Deployment sabotage claim historical and
      non-causal. Keep exact-mapping and requirement status language internally
      consistent, then obtain a focused Raze recheck before recording approval.

