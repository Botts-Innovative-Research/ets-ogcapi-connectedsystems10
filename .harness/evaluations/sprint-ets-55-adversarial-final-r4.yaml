  findings:
    - id: RAZE-S55-R4-DIRECT-RELATION-BOUNDARY-001
      severity: HIGH
      required: true
      summary: "Direct association procedures can still PASS from unrelated root aliases or arbitrary extension descendants."
      references:
        - "src/main/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/advancedfiltering/AdvancedFilteringSupport.java:720"
        - "src/main/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/advancedfiltering/AdvancedFilteringSupport.java:769"
        - "src/main/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/advancedfiltering/AdvancedFilteringSupport.java:793"
        - "src/main/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/advancedfiltering/AdvancedFilteringSupport.java:796"
        - "src/main/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/advancedfiltering/AdvancedFilteringSupport.java:1375"
        - "openspec/capabilities/ets-ogcapi-connectedsystems/spec.md:2888"
      analysis: >-
        For relations whose root evidence is allowed, collectRelation recursively
        descends every map and collection. aliasMatches then accepts any normalized
        key or rel whose name ends with an alias. A System carrying only
        metadata.unrelatedParent, for example, supplies parent IDs and UIDs; the
        same malformed representation returned from an ignored parent query
        satisfies the result oracle. The same surface affects other direct
        System, Procedure, Deployment-parent, Sampling-Feature, and Property
        relations. The controlled suite rejects root shortcuts only for
        prescribed subresource routes and has no fail-closed fixture for an
        unrelated nested direct-relation alias. This conflicts with the specified
        direct-relation boundary and explicit extension-descendant rejection.
      required_fix: >-
        Constrain relation discovery to representation-defined direct fields and
        explicitly permitted recursive association edges. Do not use arbitrary
        descendant recursion or suffix alias matching as relation provenance.
        Add requirement-linked fixtures proving unrelated root suffix aliases and
        nested extension aliases cannot seed or validate mandatory association
        filters.

    - id: RAZE-S55-R4-DEPLOYED-SYSTEM-TARGET-TYPE-001
      severity: HIGH
      required: true
      summary: "Deployment property traversal selects the direct href but does not prove that its 200 JSON response is a resolved System description."
      references:
        - "src/main/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/advancedfiltering/AdvancedFilteringSupport.java:925"
        - "src/main/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/advancedfiltering/AdvancedFilteringSupport.java:940"
        - "src/main/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/advancedfiltering/AdvancedFilteringSupport.java:950"
        - "src/main/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/advancedfiltering/AdvancedFilteringSupport.java:955"
        - "src/main/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/advancedfiltering/AdvancedFilteringSupport.java:1003"
        - "src/test/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/advancedfiltering/VerifyAdvancedFilteringHttpProcedures.java:358"
        - "openspec/capabilities/ets-ogcapi-connectedsystems/spec.md:2896"
        - "src/main/resources/org/opengis/cite/ogcapiconnectedsystems10/ats/reviewed-ats-mappings.json:614"
      analysis: >-
        The R3 fix correctly extracts only direct system/deployedSystem hrefs and
        ignores unrelated nested hrefs. After dereference, however, any HTTP 200
        response with an accepted JSON media type is passed to collectRelation.
        The isSystemRepresentation gate is used only for an inline subresource
        item, not for the dereferenced response. A non-System object or a
        FeatureCollection containing an unrelated System can therefore contribute
        observed or controlled Property evidence. Replaying the same invalid target
        from filtered Deployments can produce a false PASS. The two reviewed
        mappings also describe these responses as referenced System descriptions,
        which the implementation does not establish.
      required_fix: >-
        Require each dereferenced deployed-System target to be a single valid
        System representation before collecting its properties; reject collection
        or non-System bodies as evidence. Add fail-closed fixtures for a direct
        system href returning a non-System object and a collection containing an
        unrelated property's System.

