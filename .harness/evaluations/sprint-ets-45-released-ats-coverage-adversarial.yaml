findings:
  - id: RAZE-S45-001
    severity: HIGH
    title: Reviewed mappings can be promoted without exact one-to-one evidence
    status: CLOSED_DURING_REVIEW
    evidence:
      - >-
        ReleasedAtsCoverage.java candidateMappings and exact validation use
        String.contains at lines 139-146 and 170-177. A requirement URI that is
        merely a prefix of another URI is therefore accepted.
      - >-
        Reviewed mappings are unique only by ATS key at lines 40-49. The same
        Class#method can claim multiple released tests.
      - >-
        No review provenance is required before a mapping becomes exact or
        helper, despite REQ-ETS-COVERAGE-001 lines 116-122 requiring recorded
        review state and complete-method review.
      - >-
        Initial focused hardening Maven proved all three defects: 10 tests ran
        with 3 failures in exactMappingRequiresReviewProvenance,
        implementationCannotClaimTwoReleasedTests, and
        targetPrefixIsNotACandidateMapping.
    impact: >-
      Once reviewed mappings are populated, the gate can create false exact
      coverage and violate the central no-false-confidence guarantee.
    resolution:
      - Canonical targets now require complete delimited URI tokens.
      - Reuse of one implementation identity by multiple released tests is rejected.
      - reviewedBy, reviewedOn, and evidence are mandatory and reviewedOn is parsed as a date.
      - The three negative tests now pass; focused Maven is 10/0/0/0.

  - id: RAZE-S45-002
    severity: HIGH
    title: Committed-inventory membership validation is not fail-closed
    status: CLOSED_DURING_REVIEW
    evidence:
      - >-
        scripts/ats-coverage-audit.py validate_part at lines 145-176 verifies
        duplicate identifiers, counts, supporting counts, and target presence,
        but does not reconcile each class tests list with each test
        classIdentifier/supporting value.
      - >-
        The strengthened self-test initially failed with "Self-test tampered
        class membership was not rejected".
      - >-
        Exact source reproduction still passes, proving the committed inventory
        content is currently correct while the standalone validator remains
        incomplete.
    impact: >-
      A manually changed manifest can pass internal validation after updating
      its self-referential semantic digest even when class membership is false.
    resolution:
      - Membership is rebuilt from classes[].tests and compared to every test.
      - Full identifier, full target, allowed part, and source-parts invariants are validated.
      - Source reproduction verifies v1.0.0^{commit} resolves to SOURCE_COMMIT.
      - The strengthened audit self-test and exact source reproduction now pass.

  - id: RAZE-S45-003
    severity: HIGH
    title: Active implementation statuses contradict the zero-exact baseline
    status: OPEN
    evidence:
      - >-
        ops/ats-coverage-report.json reports 0 exact and 0 helper mappings; all
        240 released tests are candidate or unmapped.
      - >-
        OpenSpec REQ-ETS-COVERAGE-001 lines 153-157 says candidate-only or
        unmapped tests keep the owning class partial.
      - >-
        The same active spec still labels Part 1 API Common, System,
        Subsystem, Deployment, Procedure, Sampling Feature, Property, and
        Subdeployment requirements IMPLEMENTED, including lines 164-204 and
        later duplicate requirement sections.
      - >-
        Traceability and epic story rows preserve Done/Implemented labels based
        on historical class existence or smoke evidence. Story acceptance line
        39 nevertheless claims stale status correction is complete.
    impact: >-
      Readers can still infer released-class implementation from the active
      specifications even though the new authority explicitly prohibits that.
    required_fix:
      - >-
        Distinguish historical increment completion from released ATS coverage,
        and mark every owning class UNREVIEWED/PARTIAL until all required exact
        or helper mappings are reviewed.
      - Reconcile OpenSpec, traceability, both epics, story acceptance, status, and changelog.
      - Add an executable status-honesty check so unsupported implemented claims fail the gate.

  - id: RAZE-S45-004
    severity: MEDIUM
    title: Suite deployment and helper validation are only approximations
    status: OPEN
    evidence:
      - >-
        ReleasedAtsCoverage.java lines 125-136 uses getDeclaredMethods and
        accepts every method-level Test annotation without checking enabled
        state, inherited TestNG methods, overload signatures, suite method
        filters, factories, or class-level TestNG annotations.
      - >-
        Implementation identity is only Class#method and findMethod returns the
        first name match at lines 186-193, so overloads are ambiguous.
      - >-
        Helper mappings need only resolve by reflection. They are not required
        to be deployed, reusable, unambiguous, or in an approved helper set.
      - >-
        Present discovery nevertheless finds 211 methods, matching the current
        TeamEngine execution total, so this is a promotion-path defect rather
        than a current inventory-count error.
    impact: >-
      Future suite structure changes or supporting-test mappings can be counted
      as deployed without matching what TestNG actually executes.
    required_fix:
      - Use unambiguous method identities including parameter signatures.
      - Model TestNG-enabled and inherited execution semantics, or derive the deployed method set from TestNG itself.
      - Constrain helper mappings to reviewed reusable helpers with explicit signatures and evidence.
      - Add negative tests for disabled, inherited, overloaded, filtered, and arbitrary helper methods.

  - id: RAZE-S45-005
    severity: MEDIUM
    title: Gate evidence and current living documentation are stale
    status: OPEN
    evidence:
      - >-
        Contract, status, test-results, changelog, and the Sprint 45 summary
        still report focused 7/0/0/0 and full Maven 329/0/0/3, but the current
        focused worktree is 10/0/0/0 after additional hardening tests and code.
        The archived full run predates those changes.
      - >-
        The archived E2E XML and request log prove 211/69/0/142 and 135
        recognized requests with zero writes. The exact image also passes an
        independent runtime recheck, but the Sprint 45 artifact list does not
        retain raw smoke stdout or a raw runtime-verifier transcript containing
        image identity and startup-scan evidence.
      - >-
        _bmad/project-brief.md is marked v2.1/current but still specifies
        TeamEngine 5.6.1 and GitHub Actions at lines 31, 48-49, 63, and 69,
        contradicting ADR-011 and the no-hosted-CI ADR-012 guardrail.
    impact: >-
      The recorded final gate is not reproducible from the latest source and
      current living documents disagree with accepted architecture and scope.
    required_fix:
      - Rerun focused and full Maven after RAZE-S45-001 and RAZE-S45-002 are fixed.
      - Regenerate the coverage report if exact candidate-token semantics change its counts.
      - Rerun the exact-image runtime and primary local OSH TeamEngine gates from a fresh synchronized clone.
      - Archive raw smoke stdout and runtime-verifier output, including exact image identity and startup scan.
      - Reconcile contract, story, status, changelog, test-results, traceability, and the current project brief.

