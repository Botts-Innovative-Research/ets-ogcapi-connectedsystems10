findings:
  - id: RAZE-ETS68-FALSEPASS-001
    severity: HIGH
    title: mediatype-read can pass without API-definition read advertisement evidence
    files:
      - path: src/main/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/part2/swecommonbinary/Part2SweCommonBinaryTests.java
        lines: "159-193, 499-513"
      - path: src/test/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/part2/swecommonbinary/VerifyPart2SweCommonBinaryTests.java
        lines: "1-316"
    evidence:
      - "A.123 step 1 requires verifying API-definition advertisement for application/swe+binary retrieval operations before the GET/content-type checks."
      - "The implementation only probes live resources with Accept: application/swe+binary and validates HTTP 200, exact Content-Type, and non-empty body."
      - "No structural regression rejects an IUT that returns application/swe+binary but omits the API-definition retrieval advertisement."
      - "The method also accumulates missing evidence from all declared applicable resource sides and SKIPs if any side is missing, while A.123 says at least one Observation and/or Command resources endpoint is enough."
    risk: "False PASS is possible for an IUT that serves the media type opportunistically but does not advertise it as required by the released ATS; false SKIP is possible when one advertised endpoint satisfies A.123 and another declared side lacks safe evidence."
    required_fix: "Add read-side API-definition inspection for scoped Observation/Command GET operations, require exact application/swe+binary advertisement for the endpoint used as PASS evidence, add negative structural tests, and reconcile spec/story/docs wording to A.123's at-least-one endpoint semantics or explicitly document any stricter normative-policy choice outside the exact ATS claim."
  - id: RAZE-ETS68-FALSEPASS-002
    severity: HIGH
    title: schema mapping procedures validate only the first retrieved schema
    files:
      - path: src/main/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/part2/swecommonbinary/Part2SweCommonBinaryTests.java
        lines: "216-222, 269-281, 415-436"
      - path: src/test/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/part2/swecommonbinary/VerifyPart2SweCommonBinaryTests.java
        lines: "1-316"
    evidence:
      - "A.125 says for every DataStream resource, validate the Observation Schema and then validate the schema using /conf/swecommon-binary/obsschema-mapping."
      - "A.128 says for every ControlStream resource, validate the Command Schema and then validate the schema using /conf/swecommon-binary/cmdschema-mapping."
      - "The wrapper-schema methods iterate all retrieved schemas, but observationSchemaSweMappingRequiresTimeComponentEvidence() and commandSchemaSweMappingRequiresIssueTimeEvidenceWhenPresent() call observationSweSchema()/commandSweSchema(), which return schemas.get(0)."
      - "The current focused tests do not include a multi-resource negative where the first schema is valid and a later schema has invalid mapping evidence."
    risk: "False PASS is possible when the first DataStream or ControlStream schema satisfies mapping requirements but a later retrieved schema violates the released mapping test."
    required_fix: "Iterate all observationSweSchemas()/commandSweSchemas() in the mapping procedures, fail any retrieved schema with invalid mandatory mapping evidence, and add structural or controlled-HTTP regression coverage for second-candidate mapping failures."
  - id: RAZE-ETS68-FALSESKIP-003
    severity: HIGH
    title: command schema mapping SKIPs absent IssueTime after a schema is retrieved
    files:
      - path: src/main/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/part2/swecommonbinary/Part2SweCommonBinaryTests.java
        lines: "266-281"
      - path: openspec/capabilities/ets-ogcapi-connectedsystems/spec.md
        lines: "1854-1860"
      - path: epics/stories/s-ets-68-01-part2-swecommon-binary-closure.md
        lines: "34-38"
    evidence:
      - "A.129 executes the SWE Common JSON command schema mapping test; A.113 requires a Time component whose definition is http://www.opengis.net/def/property/OGC/0/IssueTime."
      - "After retrieving a Command Schema recordSchema, the implementation fails present noncanonical IssueTime evidence but SKIPs when IssueTime evidence is absent."
      - "The Sprint 68 spec/story text encodes the same weakened policy by saying canonical IssueTime is required only when issue-time mapping is present."
    risk: "False SKIP is possible for a reachable Command Schema that omits the mandatory IssueTime mapping evidence required by the released ATS."
    required_fix: "Fail a retrieved Command Schema whose recordSchema lacks canonical IssueTime Time evidence; reserve SKIP for missing prerequisites, missing condition classes, unavailable schema evidence, or no candidate ControlStream, and update specs/docs/tests accordingly."
  - id: RAZE-ETS68-DOC-001
    severity: LOW
    title: one TestNG description has a cosmetic typo
    files:
      - path: src/main/java/org/opengis/cite/ogcapiconnectedsystems10/conformance/part2/swecommonbinary/Part2SweCommonBinaryTests.java
        lines: "318-320"
    evidence:
      - "The mediatype-write description contains ':SWE Common Binary' without a space after the colon."
    risk: "No runtime or mapping impact; only report/readability polish."
    required_fix: "Fix opportunistically with the required implementation changes."
