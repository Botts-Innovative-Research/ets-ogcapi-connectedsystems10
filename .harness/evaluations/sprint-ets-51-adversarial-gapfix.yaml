    severity: LOW
    title: Positive Subdeployment paths still do not execute through TeamEngine against a real IUT
    detail: >-
      Local OSH honestly dependency-SKIPs all five methods. Controlled HTTP
      coverage executes production methods directly and the causal test uses
      programmatic TestNG, but no real IUT currently supplies a positive
      three-level hierarchy plus independent association fixture through the
      TeamEngine REST lifecycle. This remains residual integration risk rather
      than a required fix under the accepted Sprint 51 contract.
  - id: RAZE-S51-C02
    severity: LOW
    title: No Sprint 51 handoff artifact exists
    detail: >-
      No sprint-specific file was found under .harness/handoffs/. The proposal,
      story, contract, design, and architecture preserve enough context for this
      review, so the omission does not independently block closure.
  - id: RAZE-S51-C03
    severity: LOW
    title: Association omission diagnostics call parent-owned IDs descendants
    detail: >-
      SubdeploymentsSupport.java:260-267 reports every missing fixture ID as a
      descendant resource even when the omitted ID is parent-owned. Verdict
      behavior is correct, but the message should eventually say
      parent-or-descendant fixture resource IDs.
