initial_finding_closure:
  - id: RAZE-S49-001
    title: Restricted media selection
    status: CLOSED
    evidence:
      - >-
        Part1ApiCommonSupport.java:223-224 normalizes the allowed media set
        before selecting an advertised items representation.
      - >-
        Part1ApiCommonSupport.java:512-539 returns the first advertised media
        type in the restricted intersection while preserving unrestricted JSON
        selection when the allowed set is empty.
      - >-
        VerifyPart1ApiCommonSupport.java:230-267 covers generic JSON followed
        by both GeoJSON and SensorML, verifies the selected Accept value, and
        proves actual response media is gated before parsing.
      - "Independent current-worktree focused Maven included these tests and passed."

  - id: RAZE-S49-002
    title: Configuration blocker scope
    status: CLOSED
    evidence:
      - >-
        DeploymentsTests.java:237-298 filters failed and skipped configuration
        and test results through isInheritedPrerequisite, which accepts only
        Core, Common, and Part 1 API Common groups/classes.
      - >-
        VerifyDeploymentsSuite.java:75-93 proves a SystemFeatures configuration
        does not block Deployment and an API Common configuration does.
      - >-
        sprint-ets-49-apicommon-sabotage-teamengine-final-2026-07-26.xml:
        2168-2224 records setup and all five Deployment methods as SKIP because
        resourceIdsAreUniqueWithinEachType failed, not because
        fetchSystemArguments skipped.
      - >-
        The sabotage totals are 217 total / 34 passed / 1 intentional failure /
        182 skipped; hygiene reports 95 IUT GETs and zero writes.

  - id: RAZE-S49-003
    title: Canonical-link multiplicity and identity
    status: CLOSED
    evidence:
      - >-
        DeploymentFeaturesSupport.java:91-129 preserves occurrence order,
        validates every canonical occurrence against the same-origin canonical
        Deployment path, allows representation-query and duplicate variants,
        and dereferences the first occurrence deterministically.
      - >-
        VerifyDeploymentFeaturesSupport.java:66-91 covers two media/query
        variants, an identical duplicate, deterministic first selection, and a
        conflicting Deployment path failure.
      - >-
        spec.md:466-473, CP-009:49-55, and reviewed-ats-mappings.json:173-178
        agree on the released-compatible at-least-one and same-identity rule.

  - id: RAZE-S49-004
    title: Stale records and comments
    status: OPEN
    partially_closed_evidence:
      - >-
        testng.xml:53-67 describes Deployment as a direct API Common dependent
        and the current Subdeployment chain without presenting SystemFeatures
        as Deployment's current parent.
      - >-
        VerifyTestNGSuiteDependency.java:75-82 and 93-100 now distinguish the
        current Deployment/API Common path from SamplingFeatures and historical
        Subdeployment evidence.
      - >-
        epics/epic-ets-02-part1-classes.md:33 records the current
        Subdeployments-to-Deployments-to-API Common/Core path, and line 50
        records Sprint 49 at 5/5 exact.
      - >-
        Current Sprint 49 spec, mapping, coverage, traceability row, status
        header, changelog, and test-results sections report 5/5 exact and the
        honest local OSH failures.
    unresolved_evidence:
      - >-
        openspec/capabilities/ets-ogcapi-connectedsystems/spec.md:1972-1973 is
        active capability text that still says the current Subdeployment chain
        is Subdeployments to Deployments to SystemFeatures to Core.
      - >-
        _bmad/traceability.md:34 repeats that superseded chain without
        distinguishing the historical Sprint 8 topology from the current
        Sprint 49 topology.
      - >-
        ops/status.md:1446-1454 ends with an active-looking Next Action to
        implement Sprint 49 and says the dirty worktree contains specification
        artifacts only, contradicting the completed handoff at lines 64-102
        and the actual implementation/evidence worktree.
      - >-
        epics/stories/s-ets-49-01-part1-deployment-closure.md:5 and 60 mark the
        story COMPLETE and final-Raze criterion complete while lines 90-91 say
        final Raze is pending. .harness/contracts/sprint-ets-49.yaml:4 and 46
        similarly mark COMPLETE and require no open Raze fixes while line 62
        still says final review is pending.
    required_fix: >-
      Reconcile the active REQ-ETS-PART1-005 dependency description and
      traceability row to the current API Common parent while retaining clearly
      labeled historical Sprint 8 evidence. Replace the stale ops/status.md
      terminal Next Action and dirty-worktree note. Because this review found an
      unresolved required fix, return the story and contract to an active or
      review-pending state and leave the no-open-Raze criterion incomplete until
      a focused recheck approves the corrected records.

