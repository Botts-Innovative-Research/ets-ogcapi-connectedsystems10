    severity: LOW
    title: Positive hierarchy paths still lack real-IUT TeamEngine execution
    detail: >-
      Local OSH honestly dependency-SKIPs all five methods because inherited
      Deployment procedures fail and exposes no usable positive hierarchy.
      Controlled HTTP tests execute production methods and the causal test
      executes programmatic TestNG, but no real IUT currently supplies a
      positive three-level hierarchy plus independent association fixture
      through TeamEngine. This is accepted residual integration risk under the
      Sprint 51 contract, not a required fix.

  - id: RAZE-S51-FINAL-A02
    severity: LOW
    title: Association omission diagnostic calls every fixture ID a descendant
    detail: >-
      SubdeploymentsSupport.java:260-267 reports missing parent-owned and
      descendant-owned IDs as descendant resource IDs. Verdict behavior and
      exact mapping are correct, but a future diagnostic-only cleanup should
      say parent-or-descendant fixture resource IDs.

  - id: RAZE-S51-FINAL-A03
    severity: LOW
    title: Durable E2E summary names one of several failing Deployment methods
    detail: >-
      The durable verification summary attributes inherited Subdeployment
      skips to deploymentCollectionsAreValid, which is genuinely FAIL in the
      final XML, while the explicit Subdeployment SkipException text names
      everyDeploymentHasCanonicalUrl as the selected blocker. Both are
      inherited Deployment failures and the totals, SKIP classification, and
      causal gate remain correct. Future wording should use plural inherited
      Deployment failures or quote the selected blocker exactly.

  - id: RAZE-S51-FINAL-A04
    severity: INFO
    title: Post-review status-token reconciliation remains procedural
    detail: >-
      Story, contract, architecture, traceability, status, and handoff
