findings:
  - id: RAZE-S79-001
    severity: medium
    title: Sprint 79 manifest check omits a primary verification artifact
    evidence:
      - ops/test-results/sprint-ets-79-release-readiness-external-blocker-2026-08-03/verification-summary.json:10 sets manifestCheck=true.
      - ops/test-results/sprint-ets-79-release-readiness-external-blocker-2026-08-03/repo-evidence-manifest.sha256:1-9 hashes only artifact-presence.txt, blocker-text-check.txt, coverage-audit.txt, coverage-summary.json, git-diff-check.exitcode, git-diff-check.txt, iut-readiness-summary.json, json-parse.txt, and yaml-parse.txt.
      - ops/test-results/sprint-ets-79-release-readiness-external-blocker-2026-08-03/repo-evidence-manifest-check.txt:1-9 confirms only those listed entries.
      - A direct directory comparison found verification-summary.json and repo-evidence-manifest-check.txt outside the manifest; repo-evidence-manifest.sha256 itself is reasonably self-excluded.
    impact: The verification summary is a Sprint 79 evidence artifact and claims manifestCheck=true, but it is not covered by the manifest being claimed. This is not a beta/CITE/exact-promotion overclaim, but it weakens the release package's evidence-integrity story.
    required_fix: Regenerate or amend the evidence manifest/check so verification-summary.json is either hashed or explicitly documented as intentionally excluded, and make artifact-presence/check text align with that policy.
required_fixes:
  - id: RAZE-S79-001
