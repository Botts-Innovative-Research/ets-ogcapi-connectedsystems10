residual_risks:
  - >-
    The unmodified local OSH cannot execute the successful canonical branches
    because it advertises no exact Procedure collection. Controlled deployed
    HTTP regressions are therefore the positive oracle for the remediated
    canonical behavior.
  - >-
    A canonical link without an advertised media type is eligible before an
    explicitly typed later link. If negotiation returns a different media
    type, the method conservatively SKIPs; it cannot create a false PASS or
    false conformance FAIL.
  - >-
    Final credential wire detail is intentionally retained under /tmp rather
    than archived with synthetic raw captures. Its durable project summary
    records only counts and no credential value.
  - >-
    The clean OSH checkout is three commits behind its configured upstream.
    This does not indicate a Sprint 50 modification, but it remains provenance
    context for future local-IUT refresh decisions.

