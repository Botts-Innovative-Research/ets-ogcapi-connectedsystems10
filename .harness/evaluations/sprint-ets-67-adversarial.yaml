      - "src/test/java/.../VerifyPart2SweCommonTextTests.java:191-214 covers canonical IssueTime, absent non-IssueTime evidence, named issueTime without definition, and wrong IssueTime definition."
      - "src/main/resources/.../ats/reviewed-ats-mappings.json:1667-1672 now states cmdschema-mapping skips only when IssueTime evidence is absent and fails retrieved noncanonical issueTime/IssueTime evidence."
