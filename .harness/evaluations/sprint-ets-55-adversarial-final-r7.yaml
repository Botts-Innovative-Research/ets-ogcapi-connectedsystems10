findings:
  - id: "RAZE-S55-R7-REPRESENTATION-SCOPED-RELATIONS-001"
    severity: "HIGH"
    required: true
    title: "Link relation vocabulary is still applied across representation boundaries"
    affected_procedures:
      - "/conf/advanced-filtering/system-by-parent"
      - "/conf/advanced-filtering/combined-filters"
    evidence:
      - "AdvancedFilteringSupport.java:801-810 evaluates links[].rel against relation.linkRelations before representation dispatch at lines 813-819."
      - "PARENT_SYSTEM globally accepts parentSystem and ogc-rel:parentSystem while also defining SensorML attachedTo."
      - "Released SensorML mapping maps parentSystem exclusively to attachedTo; GeoJSON maps it to links."
      - "VerifyEncodingRelationTypes.java already proves SensorML System links rel=parentSystem is GeoJSON-only and must be rejected."
      - "The SensorML System collection schema permits generic links, so filtered endpoint schema validation does not close this path."
      - "The three R7 regressions cover GeoJSON suffix, case, punctuation, and broad aliases, but no malformed cross-representation relation."
    impact: "A valid SensorML System collection carrying parentSystem only in links can seed and validate local-ID and UID parent predicates, allowing PASS without the released attachedTo association mapping."
    required_fix: "Scope linkRelations by representation and owner. SensorML System parent evidence must accept only exact attachedTo, while GeoJSON may accept exact parentSystem forms. Add controlled negative tests for SensorML links parentSystem and ogc-rel:parentSystem in both system-by-parent and combined-filters, retaining positive attachedTo coverage."

  - id: "RAZE-S55-R7-RED-BASELINE-PROVENANCE-002"
