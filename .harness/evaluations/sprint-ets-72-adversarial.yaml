findings:
  - id: RAZE-ETS72-EVIDENCE-001
    severity: MEDIUM
    status: REQUIRED_FIX
    title: Sprint 72 E2E log artifacts are ignored and will be omitted from the repository evidence commit.
    impact: >
      The Sprint 72 run-summary and artifact manifest reference TeamEngine
      container logs, smoke stdout logs, OSH startup/complete logs, readiness
      stdout, and provisioning stdout. Those files exist in the working tree,
      but .gitignore's global *.log rule hides nested ops/test-results logs.
      A normal git add would commit the JSON/XML summaries while omitting
      eight raw log artifacts that support the real-IUT request counts,
      TeamEngine reachability, alias proof, and startup evidence. This is an
      evidence reproducibility gap, not a behavioral defect in the audit.
    evidence:
      - command: "git status --short --untracked-files=all"
        observed: >
          Lists Sprint 72 JSON, XML, txt, and sha256 artifacts, but does not
          list local-osh-r2-artifacts/*.log or nested populated-results and
          clean-primary-results container logs.
      - command: "git check-ignore -v ops/test-results/sprint-ets-72-mutation-readiness-audit-2026-08-03/local-osh-r2-artifacts/populated-smoke.stdout.log ops/test-results/sprint-ets-72-mutation-readiness-audit-2026-08-03/local-osh-r2-artifacts/populated-results/s-ets-01-03-teamengine-container-2026-08-03.log ops/test-results/sprint-ets-72-mutation-readiness-audit-2026-08-03/local-osh-r2-artifacts/local-osh-startup.log"
        observed: ".gitignore:27:*.log matches all three sampled Sprint 72 nested log artifacts."
      - path: ops/test-results/sprint-ets-72-mutation-readiness-audit-2026-08-03/local-osh-r2-artifacts/artifact-manifest.sha256
        observed: >
          References clean-primary-results/s-ets-01-03-teamengine-container-2026-08-03.log,
          clean-primary-smoke.stdout.log, local-osh-complete.log,
          local-osh-startup.log, populated-mutation-readiness.stdout.log,
          populated-results/s-ets-01-03-teamengine-container-2026-08-03.log,
          populated-smoke.stdout.log, and provisioning.stdout.log.
      - command: "git ls-files --others -i --exclude-standard ops/test-results | rg '\\.log$' | wc -l"
        observed: "51 ignored ops/test-results log files currently exist in the working tree, including 8 Sprint 72 logs."
    required_fix: >
      Before reporting Sprint 72 complete or pushing it, make the Sprint 72
      log evidence commit-reachable. Acceptable fixes include force-adding the
      eight Sprint 72 .log artifacts, renaming/copying them to tracked .txt
      evidence files, or adding a narrowly scoped .gitignore exception for the
      Sprint 72 evidence directory. Then add or refresh an in-repository
      evidence manifest that verifies the committed artifact subset.
