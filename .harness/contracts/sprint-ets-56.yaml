success_criteria:
  - Exactly twelve independent TestNG methods map the released procedures without alwaysRun.
  - Failed API Common prerequisite skips all twelve methods before IUT access.
  - Every procedure checks exact declarations, applicable conditions, and mutation safety before writes.
  - API Common is the only direct local TestNG prerequisite.
  - Immediate and queued POST, PUT, and DELETE are accepted only when bounded configurable polling observes each required postcondition.
  - Every applicable declared resource representation is exercised.
  - Both released cascade graphs, pre-delete associations, and exact HTTP 409 refusal semantics are verified.
  - Nested creation is verified at canonical URLs.
  - Every advertised applicable custom collection is exercised.
  - Root and non-root delete propagation remain distinct.
  - text/uri-list verifies OPTIONS, HTTP 201 plus Location or queued HTTP 202, and returned and computed collection representations.
  - Cleanup is reverse-order, failure-visible, and runs after assertion failures.
  - Cleanup identity-verifies Location before destructive use and performs root identity discovery after deleting an alias Location.
  - Accepted-but-inconclusive queued operations SKIP without being counted as positive lifecycle evidence, while cleanup failures remain visible.
  - Generic non-System DELETE omits the cascade query parameter.
  - Default primary local OSH smoke has zero writes.
  - Owned isolated local OSH mutation E2E records honest outcomes and cleanup.
  - Primary OSH state remains unchanged and clean-primary smoke passes.
  - Focused/full Maven, coverage, exact-image, dependency, credential, immutability, and hygiene gates complete.
  - All twelve ATS mappings remain candidate until positive mutation E2E and all gates complete.
  - Raze reports no unresolved required fixes.
guardrails:
